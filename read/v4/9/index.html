"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T26fe1,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 3:\u003cbr/\u003eAn Infinite Variety\u003cbr/\u003eof Wishes\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eB\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ereakfast time. I avoided the buffet that was popular with a lot of the students, and made my way toward the ship’s deck. There was a café called Blue Ocean, which had hardly any students early in the morning. I took a table in the shaded back, where there weren’t many people around. It was 7:55 in the morning.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust one minute before the designated meeting time, the person I was waiting for appeared. She wore an emotionless expression, like always.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re rather early.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita sat down next to me. She was the one of the very few people at this school whom I could call a friend. She was unusually talented, and a thorn in my side, because she knew something about my hidden life.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was waiting for an hour.” I tried teasing her a little.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not my problem, as I’ve still arrived before the designated time. Besides, how would I know if you’d been waiting even ten hours or more?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt really wasn’t easy to tease her. Pointless, actually.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita wasn’t good at chit-chat. After I gave her my information yesterday, she hadn’t been able to reciprocate. All she did was propose we meet here. Was this some sort of trick? “So, did you get any more details?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Just what you already told me. There are twelve groups, and four outcomes. Also, the school said they would send the names of the VIPs via email at 8:00 a.m. today. Any minor differences in the explanations they gave us could be attributed to differences in the way teachers communicate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who’s in your group? How many people do you have?” I’d seen some of the lineup yesterday, but she knew that already.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The list is honestly surprising. It’s biased to the point where I can’t imagine it’s a coincidence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita handed over a slip of paper, looking a little depressed. She’d written this down on her own notepad, and had memorized all the names. I took the list and looked it over. Her group name was Dragon. I understood what Horikita meant about bias when I looked at the names.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCLASS A:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Katsuragi Kouhei, Nishikawa Ryouko, Matoba Shinji, Yano Koharu\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCLASS B:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Andou Saya, Kanzaki Ryuuji, Tsube Hitomi\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCLASS C:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Oda Takumi, Suzuki Hidetoshi, Sonoda Masashi, Ryuuen Kakeru\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCLASS D:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Kushida Kikyou, Hirata Yousuke, Horikita Suzune\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst, the Class D students, Hirata and Kushida: They were both excellent students, and representatives of our class. Excluding the fact that Horikita was far too much of a loner, she definitely had outstanding talents that let her stand shoulder to shoulder with the other two. To be perfectly honest, it was the strongest hand Class D could have dealt. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d thought they’d have at least one more person, but that wasn’t the case. In terms of latent ability, Kouenji had an abundance, but he probably wouldn’t contribute any of it to the team. I didn’t know what group he was in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. This really seems like an inevitable grouping,” I\u0026#160;muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven if I just limited it to the names I knew, they had Katsuragi from Class A, Kanzaki from Class B, and Ryuuen from Class C. All class representatives. If you thought of their group like players in the qualifying rounds of a soccer league, they were the dream team, and this was a death match.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But something feels unnatural,” I added. I didn’t really know many students, but it was somewhat unnatural for Ichinose to be in Rabbit and not Dragon.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean Ichinose-san being in your group, don’t you? I suppose only the Class B students know if she’s really excellent or not. A leader’s qualities and level of excellence aren’t necessarily directly proportional,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, are you talking about yourself?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe glared, so I averted my eyes. However, Horikita did have a point. We didn’t know the finer details of Ichinose’s abilities. Perhaps her academic scores were unexpectedly low.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From what we can deduce, I wonder if there’s a certain method they’re using to sort us into the twelve groups? Ayanokouji-kun, your grades are very similar to Karuizawa-san’s. Are they grouping us based on our scores? Oh, but Yukimura-kun has high academic ability, and so does Kouenji-kun. They’re at the top of the class,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was taking our midterm grades and final exams into consideration. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But there’s probably a gap between me and the Professor, same as you and Hirata. There are too many details that don’t fit the score theory.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf students were divided into groups based purely on grades, then Kouenji should have been at the top. Of course, I agreed that our grades were taken into account, but another variable was likely involved in the process. If at all possible, I would’ve liked to see the member lists of the other groups.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, this is probably going to be difficult. Trying to lead the group and to outmaneuver everyone, I mean.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, when you had several high-ability people gathered together, the inclusion of the rather orthodox Horikita wasn’t necessarily advantageous. She and Ryuuen were especially incompatible, like fire and water. I didn’t like it; they were bound to clash.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut if I told Horikita that, she would probably be pissed. I decided to stay quiet. However, Horikita would probably work well with a straightforward person like Katsuragi. They both believed that intellect led to victory, so they’d get along.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it’s just about time,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce the clock struck 8:00, both of our phones beeped simultaneously. We immediately checked our phones. After we’d finished reading the contents of the message at almost the exact same time, Horikita turned her phone to show me the message. I did the same. We\u0026#160;compared what was on each other’s phones, confirming the finer details.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“After thorough consideration, you have not been chosen to be the VIP. Please remember to be a team player as your group tackles the challenges of this test. The exam begins today, and will be held over a period of three days. Members of the Dragon group should gather in the Dragon room located on the second deck.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy message was almost the same as Horikita’s. Of course, the name of the group differed, but everything else matched up perfectly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose neither of us was chosen, then.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile putting our phones away, we shifted in our seats.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, we weren’t chosen. I’m not sure if we should be happy or sad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. If you’re chosen, then you could lead your group to any of the outcomes,” I reasoned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBeing the VIP in this test placed you at an overwhelming advantage. If you kept up a good poker face, you could easily obtain 500,000 points. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, I don’t like how they wrote it. It’s like they’re saying I’m not qualified to be the VIP.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she was on the dream team, Horikita still thought of herself as working alone. That was just like her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In this test, there’s a huge difference between the chosen students and the rest. Everyone who wasn’t chosen will need to struggle to find the VIP. The school said there were no disadvantages, but that was a lie. Unless the VIP is in your class, there’s a high probability that the point difference between classes will widen even further.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was certainly true. Depending on how things went, the gap we’d managed to close after the first test might widen again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The leaders of each group should be coming up with a number of strategies already. If we don’t decide early on how we’re going to conduct ourselves, we probably won’t recover.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand,” Horikita responded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe gave me a slightly frustrated look. I was trying to figure out how to fight this battle. As I considered the members of my group, and the underlying mechanics of this test, the goal began to take shape.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you thinking about the results?” asked Horikita, observing my expression. She sounded hesitant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are some things I can’t yet see, like how some of the students I don’t know will react. I won’t know until I meet with them directly. But I thought of a way to lead us to victory.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, we couldn’t behave recklessly. I’d need to time my move properly, and everything would need to be set up beforehand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I look forward to your results,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Me too. Can’t wait to see what you do with your group,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut something about that message still nagged at me. “After thorough consideration,” it had said. That odd choice of words wasn’t by chance. Mashima-sensei had said something to the same effect. The VIP had been chosen based on certain considerations. There was something about the chosen that set them apart.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t get too hung up on phrasing right now. I\u0026#160;knew that one person had been selected from each group. That meant there were twelve VIPs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the sake of reference, who are you most wary of? Based on how things have been going, I wanted your thoughts,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita’s attention had shifted slightly. Since she was assigned to the most intense group, that wasn’t surprising. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was fast.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no one else I’d choose,” I replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about Katsuragi-kun? It’s because of him that Class A managed to quickly hold down that prime spot on the island. Isn’t he someone worth watching?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. Considering he’s only a first-year student, he’s excellent. If you’d asked me who the most excellent student was, then Katsuragi would’ve been my answer. But if you’re asking who I’m wary of, then it’s Ryuuen, by a mile,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass D had been victorious during the test on the island, without a doubt. Ryuuen had come up short in several ways. He’d telegraphed his intentions, so it ended up easy to get a read on him. However, it was highly likely that Ryuuen had read my intentions, too. I wanted to avoid him finding out that I was the one responsible for Horikita’s success on the island.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m curious about some things concerning the VIP’s identity. Even after reading the message and thinking about it, did you notice any unnatural-sounding phrases in the school’s email? And the strict—” Horikita said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI silenced her by pressing my finger to her lips. Speak of the devil—a shadow appeared before us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nice weather, eh Suzune? You having breakfast with this clingy beta male?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwo people approached us, each wearing an unsettling grin. One of them was Ryuuen, the very subject of our discussion. The other person was…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve warned you not to call me by my first name, Ryuuen-kun. Also, considering you were a turncoat who only pretended to be our friend, it’s odd you’d show your face, Ibuki-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBeside Ryuuen stood a female student, Ibuki Mio. She\u0026#160;had a somewhat cocksure gleam in her eyes. She also happened to be in the Rabbit group with me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki seemed slightly disapproving of Horikita’s light provocation, but didn’t snap back. Instead, she bit down lightly on her lower lip. Ryuuen, watching things unfold out of the corner of his eye, flashed a satisfied smile. During the test on the island, Ibuki had infiltrated Class D as a spy. Eventually, Horikita had caught Ibuki red-handed, but ended up catching Ibuki’s fist during their ensuing confrontation. Horikita firmly insisted that if she hadn’t been ill at the time, she wouldn’t have lost the fight, but right now, I wasn’t really concerned about who was stronger. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen silenced Ibuki. He appeared to be mocking us. “You should have received the message already. What were the results? Were you chosen as the VIP?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As if I would tell you. Perhaps you’d like to tell us about \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e message?” Horikita responded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you wish.” Ryuuen straddled one of the two vacant seats. “But before that, I want to ask you something. How did you wrangle those results on the island test?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have nothing to tell you,” Horikita responded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita looked completely calm; she didn’t shake or waver in the slightest. There was nothing false about her attitude, either. She had incredible acting ability. She probably didn’t think she was acting, though. Even though she didn’t show any weakness, Ryuuen wasn’t convinced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose you wouldn’t give anything away, but that doesn’t matter. According to my information, there’s no way that your farcical bumbling on the island should’ve led to victory,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not so stupid that I’d let someone like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eher\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e see through me. Things were simply more difficult because of my fever.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn responsive to that more blatant provocation, Ibuki could no longer hide her irritation. “In that case, let’s have a rematch,” she challenged.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita kept her cool as Ibuki became more and more riled up. “Regrettably, I must decline your offer. Violent actions are considered a violation of the test rules. If you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e happen to strike me, I will not hesitate to report it to the school. At any rate, please feel free to do whatever you please,” she said flatly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tch!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki closed the distance between herself and Horikita, looking ready to lunge, but she stopped herself. If you thoughtlessly went on a rampage here, you wouldn’t escape punishment. More than anything else, though, Ibuki was working beneath Ryuuen. She didn’t have the right to act freely. While Ibuki clearly detested Ryuuen, she was also exceptionally talented. That was likely the precise reason why Ryuuen had chosen her as the spy to infiltrate Class D. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Since we’re all together, how about we have some coffee? It seems a good time to enjoy a nice cup,” Horikita offered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe seemed in a strangely good mood as she ordered her morning coffee. I ordered the same thing. Ryuuen showed no signs of leaving, apparently wanting to continue the conversation. He continued to observe the silent Horikita, and opened his mouth once again when the coffee arrived. “Yesterday, it seemed Katsuragi was rather cautious of you,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s understandable. He couldn’t have guessed that someone from Class D would do so well. Isn’t that why you and Ibuki-san are here? You came to check on me. Am I wrong?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. Well, I won’t deny that. I came here to measure your abilities for myself,” he answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course,” Horikita answered, sipping her coffee. She\u0026#160;seemed at ease, which was unusual.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol4_INTERIORILLUSTRATIONS_4\" src=\"/hola-lector-agua/images/books/v4/OEBPS/Images/ClassroomElite-Vol4_INTERIORILLUSTRATIONS_4.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Katsuragi and I think differently. When I’m dealing with someone, I like to keep an eye on them.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re free to do as you please, but what exactly are you thinking?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m remembering the test on the island. The result. The process that led to it. There are only certain types of people who would’ve been able to conceptualize and execute a plan like that. A girl like you is far too serious-minded to have come up with it,” reasoned Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Think whatever you like. Though I wonder…how did you figure out my strategy? You only saw the results of the test. How do you know the way in which points were gained and lost? Those details are supposed to be unknown,” countered Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response to Horikita’s calm demeanor, Ryuuen flashed his teeth in curious amusement. “Katsuragi probably didn’t know.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBased on how he’d said it, Ryuuen most likely \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e know.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, why don’t you explain it to me? If you’re correct, I’ll give you an answer. If you \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecan\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e answer, that is,” Horikita added. Ryuuen just laughed unnervingly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At the end of the test, I wrote down your name as leader, but that was wrong. There’s just one reason why that was wrong: Your class leader changed right before the test ended. The only explanation,” mused Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you think that was hard to deduce? Any idiot could have figured that out if they thought about it for a minute. Even Katsuragi-kun, who you’ve been making fun of,” answered Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah. However, Katsuragi thinks \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e planned the whole thing. But was that really the case? In my opinion, you becoming the leader and then retiring were both unexpected. Besides, I had my own strategy in place. I had Ibuki infiltrate your class to find out the leader’s identity. You did nothing to counter that strategy at first,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it possible that I’d simply taken the proper precautions? Preparing for the unknown is absolutely basic logic. The moment Ibuki-san met Class D, I took all possibilities into account. You were so confident, but your argument ended up being flimsy. You’ve said nothing surprising,” responded Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The key question is who replaced you as leader. Personally, I think the second leader was pulling your strings from behind the scenes during the entire test.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was exactly as Ryuuen had said. Though he spoke to Horikita, he observed me quietly. If I appeared shaken for even an instant, he’d pounce.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m afraid I can’t understand you at all. I have no close friends. The closest I have would be Ayanokouji-kun here, and he’s always dragging me down. I’d be hard-pressed to say that he’s working with me. Sad, but true,” answered Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy specifically drawing attention to me, Horikita had managed to make me seem useless. Well done.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, if we \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003echange leaders, he wouldn’t be the most likely candidate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.” Ryuuen glanced at me, but quickly looked away. “Well, I suppose that’s expected of a clingy tagalong.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So now you understand. Though I wonder what basis you had for your hypothesis,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That guy with you is considerably smart. Despite that, he hasn’t achieved anything significant, or gotten high grades. He has some excellent qualities, though I have my doubts,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve investigated Class D rather thoroughly, it seems. Ayanokouji-kun, we’ve been putting you down mercilessly. Aren’t you going to defend yourself?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would if I had anything to defend,” I responded. My lazy façade had become the perfect counterattack. I’m not exactly sure how he figured that out, but Ryuuen appeared to understand me. Maybe he’d spent time measuring my academic abilities, physical abilities, and even communication skills. Grades were objective and reliable. You couldn’t deceive others with that information. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m sorry, but what you’re saying is complete nonsense. It’s a child’s excuse, used because he’s upset that he lost and needs to resort to fantasy. Does it embarrass you that a girl managed to see through your schemes?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see your point. I never imagined you’d trip me up. I’ll admit it. The results of the test shocked me,” answered Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he’d admitted weakness, Ryuuen laughed. If anything, he acted like our actions had been almost irrational.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s too bad. I love surprise attacks, foul play, and subterfuge. That level of strategy was totally unexpected, but your victory high will soon come to an end. Whether it’s you, Suzune, or someone pulling the strings behind the scenes, you’re stupid. You’ve already made your best move. Class D is one or two steps behind the other classes in points. The challenge will only heat up from here. You already played your trump card during the survival test, when the game was just getting started. You couldn’t see what was in front of or behind you. I\u0026#160;don’t think you’ll find this round as easy as last time. Tell that to whoever helped you ace the test,” warned Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My goodness, that was rather thoughtful,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What can I say? I’m quite merciful.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It sounds like you really want to believe that we have a secret weapon in our class,” observed Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen didn’t answer. Even though he didn’t have any evidence, he couldn’t restrain from doubting Horikita. Ryuuen believed in himself more than anyone else. He refused to accept even the slightest hint of advice from others. He didn’t appear to want to confirm anything during this encounter, only to chat with Horikita and pass the time amusing himself. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen took out his phone and pointed it toward Horikita. He snapped a single picture, the shutter from his camera making a clicking sound.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t take my photo without permission!” snapped Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Relax. Here, I’ll show you,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRyuuen looked at the picture he’d taken of Horikita, which showed her wearing a particularly sour expression. He put his phone away, looking satisfied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Someone in Class D other than you is quite clever. There’s no mistake about that,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, isn’t that a good thing? I don’t particularly care. Besides, if you just arbitrarily jump to conclusions, why bother badgering me to confirm them?” asked Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A conversation reveals many subtle things. I’m glad I could talk with you, Suzune. It’s a game to me. I’ll discover who among you is making moves behind the scenes. Everyone, including your clingy friend here, is a target,” said Ryuuen.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me ask you something. I know it hurts that I saw through you, but why are you so fixated on me? Aren’t you concerned about anyone else? Like Ichinose-san, or Katsuragi-kun? Going by the rumors, there’s someone named Sakayanagi, too. Shouldn’t the people in the classes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eabove\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e C be your concern? You should be able to at least answer that, I think,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita was right to question him. Ryuuen’s focus was downright obsessive. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I already know their abilities, to some extent. Neither Katsuragi nor Ichinose is my enemy. If I wanted to crush them, I could do it any time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So what about Sakayanagi?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki asked that, not Horikita. She wanted to confirm that information herself, apparently. Ryuuen, who’d been unflappable until now, was silent before responding.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m saving her for the final course. It’d be a waste to eat her now. Let’s go, Ibuki.” Ryuuen stood and left with his lackey.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re a person of interest, Horikita,” I mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And who’s responsible for that, hmm?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you upset?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Not really. It’s just that I hate your sarcastic way of speaking. I’ve always aimed to reach Class A, so I assumed I’d be attracting a lot of attention,” she answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m glad to hear that. Well, at any rate, this doesn’t seem good. Ryuuen isn’t an ordinary opponent.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? I think he just doesn’t like that I found him out, and wanted to trick me into revealing the truth. I\u0026#160;can’t imagine he narrowed down the list of potential candidates to you. Besides, even if he knew your identity, you’d be the only one in trouble,” replied Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI knew he suspected me, but that wasn’t important. I\u0026#160;didn’t know what Ryuuen was thinking, but the fact that he showed up here was dangerous. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think we were being spied on. Him suddenly meeting up with us is too convenient,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you talking about Ibuki-san?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe she was forced to keep an eye on us, or maybe she just happened to see us by chance. If that’s the case, it would help us,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki hadn’t looked tired. Someone else may have been keeping watch, but Ibuki was likely involved, considering she was walking with Ryuuen. If I had to guess, Ryuuen was already implementing his new strategy, and using this test to do so. I was the first person to join up with Horikita. There probably weren’t many people he’d suspect to begin with.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A mistake,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d seemingly meant to say that there was someone smart here, someone just like him, but that was a little easy. Our encounter may have given Ryuuen an even bigger hint than I’d imagined. Was I just being overly concerned about the test? \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re overthinking things. No one thinks you’re involved. Despite what he said, he thinks you’re an ordinary person, considering your lackluster achievements in the first semester,” said Horikita.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t know if that was a compliment or not, but she certainly had a point. No matter how much Ryuuen investigated me, he would find nothing. An ordinary person would try to avoid being rendered useless, which should put me outside the purview of his concern. Even so, because I was close to Horikita, I was undoubtedly being watched. At any rate, since Ibuki was in my group, she’d be an obstacle. It was going to be very difficult to maneuver.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eStudents started popping up here and there around us, and I stood up. “I think we’re done for the time being. I’m still sleepy, so I’m going to head back to my room,” I\u0026#160;muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita appeared fine with that, like she didn’t need any advice. “Discussion is likely useless from here on out. We’ll go our separate ways. Anyway, excellent work. If you make any progress, give me a report.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite being surrounded by powerful foes, Horikita was indomitable. Well, Hirata and Kushida would hopefully keep her in check. I’d head back to my room and sleep until the afternoon. Even though the test had started, I’d be useless until the time came.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“S\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eorry to keep you waiting! \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eUrrp! Urp!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e If you eat three heavy meals for lunch, you’ll naturally have a full belly. I considered going on a diet, but it seemed futile,” said the Professor. He walked up to me while patting his full belly, which was more swollen than usual. He met Yukimura and me right in front of the appointed room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re rather relaxed, considering the test has just begun. Me, I can hardly eat.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If you’re not at full strength, there’ll be trouble. It’s like choosing a higher difficulty setting in a video game, wouldn’t you say?” the Professor responded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stop talking like that. It’s weird,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, all the Professor’s talk sounded like arcane magic to people who weren’t accustomed to nerd culture. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOnce you got used to it, it was fine. However, if I tried joining in right now, I’d probably antagonize Yukimura, so I decided to refrain.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho! Hmm, dost thou not care for my linguistic idiosyncrasies? Well then, Yukimura-dono, what wouldst thou like?” The Professor seemed like he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewanted\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to antagonize Yukimura. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever, I don’t care. Just talk normal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From now on, I shall be like the protagonist who appears weak, but secretly has massive strength. I normally have no motivation, but I’ll become a completely OP cheater with enough power to destroy the entire world. I mean, I’m just following the current trends!” the Professor mused.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Professor seemed like he wanted to become some mystery character from a game or anime. I no longer understood what in the world he was talking about. If we’d been in a gag manga right now, this would be the moment when Yukimura’s glasses would probably crack. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura stormed away from us. The Professor and I hurried after him.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji. There’s something I wish to ask you. Please give me a straight answer,” said the Professor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Professor was talking like he was Takakura Ken or something, like he really was the protagonist of a story. He even had the same brooding expression. I had to hold myself back from instinctively calling him “Ken-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You want to ask me something?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve considered what kind of speech patterns you might like. Of course, a pleasant dialect that a cute heroine character uses would be good,” said the Professor. He spoke in a very cool, stoic way, but his words were the same as always.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I don’t have a favorite speech pattern or anything. Not especially, anyway,” I answered. For someone who was born and raised in Tokyo, I didn’t really know much about other dialects and the like. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Have you perhaps encountered a speech pattern that felt \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emoe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?” the Professor asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWho the hell possessed such a speech pattern, anyway? Well, I’d keep talking to him for a little longer, since I wanted to kill time. “Well, Professor, what about you? Do you have a speech pattern you like?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. I’ll rank them. In third place would be ‘Even if you say so, Kudo!’ That’s the old stand-by, the Kansai-ben! It tends to give a somewhat tough or crude impression, but it’s the obvious choice. It’s an essential dialect. In second place is the beautiful girl from a snowy country, the Hokkaido-ben! When they say, ‘Oh, sorry for the trouble, thanks,’ and stuff like that, it just makes me swoon! Those unique phrases are so \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emoe\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e they make me want to die! It also gets points because it’s not used very widely in the 2D world!” exclaimed the Professor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUh oh. I had almost no clue what anything he said meant. But before I was able to collect my thoughts on the matter, the Professor freely segued into the final part of his announcement, using his lips to make a bizarre drumroll sound. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Dourururururururu… Coming in first place, jumping from little girls to the older sister, the universal Hakata-ben! When I hear stuff like ‘I like ya!’ or ‘Ya like me?’, it just sounds great! In addition to the wide variation the dialect offers, you could also say that it’s the broadest there is, even at its core! Those are the best three by far!” the Professor shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnfortunately, he was talking in a language I didn’t speak, but his passion came through loud and clear. At any rate, we’d killed some time. We arrived at a second-level room with a nameplate that read “Rabbit.” The test had just begun, so the hallways were packed with students. Even so, it didn’t feel cramped, most likely because the ship was so large.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The time for screwing around ended yesterday. From here on out, we need to fight for ourselves and for our classes.” Yukimura directed that statement toward the Professor, but I nodded in acknowledgement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh. No matter how you look at it, we really do have the worst team.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa entered the room, casting her eyes away from us. We had eleven people, Karuizawa included, and all sat in chairs arranged in a big circle. Given the low number of vacant spots, we were likely the last to arrive. I didn’t know everyone’s names, but aside from Ichinose and Ibuki, there was another student I recognized. It was the boy from Class A who I’d bumped into completely by chance during the previous test, who’d proposed that I betray Class D. I hardly recognized any of the other guys or girls. Rivals up until today, we suddenly had to cooperate with each other. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNaturally, the other classes were puzzled as well, not just Class D. Students mostly divided into natural groups based on their class, but Karuizawa and Ibuki both sat a little further away, as if isolating themselves.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why did they…?” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter, Ayanokouji? Something on your mind?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s nothing,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d thought for sure that Karuizawa would confront Ibuki the moment she saw her. After all, Ibuki Mio had stolen Karuizawa’s underwear back on the island. You’d think she’d want revenge, but… Well, maybe Karuizawa was more mature than I’d thought, or maybe she’d already gotten her revenge. In any case, it was all rather unnatural. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBefore I could speak, a voice came through the ship’s loudspeakers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The first group discussion begins now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA short, concise announcement. Naturally, no one was taking the lead. An awkward pall hung over the room. Then Ichinose Honami cracked a small smile and stood up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Your attention, please! I don’t know most of you, but I think we ought to introduce ourselves. After all, there are probably people here who haven’t met before,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was just like her to immediately volunteer herself as the leader. It wasn’t easy to take initiative and pull a group of people together, no matter how popular you were. The fact that we were enemies didn’t make it any easier, but Ichinose didn’t seem to dislike her role. If anything, she seemed to be having fun. Some of the Class A students appeared somewhat perplexed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is it really necessary to introduce ourselves, though? I don’t think the school seriously meant that. I think it’s fine if only the people who want to introduce themselves do it, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, if that’s how you feel, Machida-kun, I can’t force you to do anything. However, a microphone might have been installed somewhere in the room to record everything we’re saying, don’t you think? If that’s true, it may not be an issue for just the people who don’t introduce themselves. The entire group might end up shouldering the blame,” warned Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had a point. Individual non-cooperation here could be a problem for everyone. Put like that, not even Machida could refute her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose introduced herself first. I tried to put a little effort into my self-introduction, remembering how I’d failed to introduce myself well during the entrance ceremony. But in the end, my introduction was just as monotonous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey there, Ayanokouji-kun. Looks like we’re in the same group! I’m looking forward to working with you,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe probably meant to comfort and console me. I\u0026#160;took my seat. Once everyone had finished, Ichinose spoke again.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that we’ve finished, how do you think we should proceed? Please tell me if anyone disagrees with my taking the lead,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose appeared ready for someone else to volunteer as leader. Of course, whoever opposed her would have to publicly volunteer him or herself. Some students might’ve been dissatisfied with how Ichinose handled things, but since they likely feared being burdened with leadership, no one raised their hand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, since it looks like no one especially wants the spot, I’ll take the lead. To begin with, I think if there’s any point that people don’t understand or are worried about, we should all discuss it. If we don’t, the situation will get worse over time. Does anyone have any questions?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBecause people never want to speak up in front of a group and make a fool of themselves, no one raised their hand. This was exactly what always happened when you had a bunch of strangers in one place. Being able to step up and take responsibility in such a situation was the hallmark of a leader. Ichinose put a hand on her hip and smiled, undaunted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s something I’d like to talk to you all about. I’d like you all to assume that no one here is the VIP, and I’d like for us all to work together and clear this exam. In other words, I want to know if you think our best option is to pursue Outcome #1,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the heck are you talking about? Isn’t that obvious?” snapped Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa didn’t understand, but with that simple question, a hierarchy formed within the group. The dam had burst. Yukimura and a girl from Class C named Manabe followed suit. They agreed with Karuizawa and said they obviously wanted to cooperate. If everyone wished for it, we’d all pass the test with Outcome #1. A\u0026#160;natural thing to say. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn response, one of the boys from Class B raised his hand. His blue, smooth hair swayed slightly. He was a thin, somewhat androgynous-looking young man who’d introduced himself as Hamaguchi Tetsuya. “I agree, of course. We’re a group, and it’s only natural for us to cooperate,” said Tetsuya.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis had been a good way to start things off. If Ichinose’s question sounded obvious to someone, that meant they weren’t the VIP. The VIP would be forced to lie, while checking to see if they shared the group’s feelings. If someone fell for it, then we could start narrowing down the list. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, the situation wasn’t that black and white. It would be dangerous to assume anything based on this one question alone. Ichinose had spoken first, and Karuizawa had agreed first. Yukimura and Manabe had followed her closely. Then came Hamaguchi from Class B. It wouldn’t be surprising if one of them was the VIP. Boldly lying would divert suspicion, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI decided to jump in. “I agree, too. We’re a group, like you said, and we could all use some private points. If it’s possible, I’d like us to work together. What do you say, Professor?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Professor, who’d been rubbing his swollen belly, recoiled in surprise when I called on him. “Of course I’ll cooperate. I want points,” he answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed the Professor was still trying to play the part of “mysterious character,” based on his answer. I’d never heard him use that tone of voice before. The only ones who looked doubtful were the Class A boys. They seemed to calmly analyze the situation, considering each individual member’s opinion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ichinose, that question was unfair, wouldn’t you say? If you say something like, ‘assume that no one here’s the VIP,’ aren’t you subtly calling the VIP a villain? Besides, no normal person would announce that they’re going to betray anyone.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMachida spoke these words with an air of suspicion. His response was clearly different from those of Classes D and C. Machida seemed doubtful of Ichinose, and ready to criticize her. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHamaguchi calmly responded to Machida almost immediately. “Isn’t that a perfectly valid question, though? Ichinose-san didn’t threaten us. She didn’t order us to answer. If you don’t want to, you don’t have to respond,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHamaguchi had coolly brushed aside all of Class A’s criticism. Apparently, a war of words was brewing. Machida wasn’t fazed by Hamaguchi at all. Rather, he spoke as though he’d expected it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s most certainly true. In that case, I think all of us from Class A will remain silent.” Machida crossed his arms. The other two people from Class A seemed to share his attitude. Everyone else who hadn’t yet answered decided to remain silent as well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe that question was too harsh?” mused Ichinose. She smiled bitterly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I think that your question was valid, Ichinose-san. Their wariness is extreme. I’d like to ask you something, Machida-kun. What question do you think would be appropriate? I don’t think discussing our favorite foods or hobbies would be relevant to the exam. If you simply refuse to engage, then I’m unconvinced you can offer anything of value,” Hamaguchi said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing to offer? That’s not the case at all,” said Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know specifically why Ichinose-san asked that question. However, this test requires us to come to a solution through discussion. If the students from Class A want to sit in silence, then we’ll have to carry on without you. At the very least, why not tell us what you think we should be discussing?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHamaguchi was right. Machida knew this, but kept his arms crossed and refused to answer. Ichinose looked like she was approaching a locked castle gate. She readied her verbal battering ram.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d rather not do this, but think of it this way. Sometimes we may need to make decisions based on a majority vote. People will most certainly be suspicious of those who don’t want to answer the questions, and the group might turn against them. What do you say to that?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had taken a battering ram straight to the doors of Class A's castle. Her logic was similar to Horikita’s, but the crucial difference was that Ichinose could bring people together. Being able to take tactical action while also gaining the group’s approval demonstrated her powers of persuasion. Since most of the people in this room were already on Ichinose’s side, she was the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ede facto\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e leader. It was deceptively simple. I didn’t know of anyone else in our school who matched her talents. Not even Katsuragi or Ryuuen could do the same. Even Hirata and Kushida might find themselves outmatched, despite their overabundance of friends.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that a threat?” asked Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please don’t misunderstand me. I just want to talk. You may answer however you please, but I want everyone to step up to the plate in this test. In other words, I want you to participate,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMachida muttered to himself before snapping, “Will this test really be settled through discussion, though? Will you really discover the VIP through talking? Or are you going to bow your head and ask the VIP to help you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, Class A’s policy had already been decided. But I didn’t think that Machida himself held the power. I sensed someone else behind Machida, pulling the strings.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is there another way, then?” asked Ichinose. Nine times out of ten, there wouldn’t be. But Class A had apparently been waiting for her to ask.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There is. There’s a way to clear this test easily, and come out on top,” Machida replied without the slightest hesitation or anxiety. Ichinose and Hamaguchi couldn’t hide their surprise.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you mind enlightening us?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. As a group, we ought to share valuable information,” said Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMachida’s fake altruism didn’t fool anyone. He was talking about a Class A strategy. Something extremely simple. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I recommend that we don’t discuss things at all,” he said, speaking loudly enough for everyone to hear. Karuizawa and the Professor appeared to understand him easily enough. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s a rather unique idea. How exactly will we come out on top without discussing things, though? Do you think we should let the VIP remain anonymous, and quit while we’re ahead?” Hamaguchi spoke up, looking mildly irritated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. The shortcut to victory is to avoid extraneous discussion,” replied Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t believe this. If anything, I’m starting to believe that the VIP is someone from Class A. Are you just sharing information with the VIP and taking measures to protect him or her?” Hamaguchi asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe had a point. Think about it. Let’s say the VIP was someone in your class. If you gave away that information, discussion would be pointless. Hamaguchi’s opinion was valid.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t matter what class the VIP is in. You can most definitely win if you don’t talk. That was Katsuragi-san’s proposal.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Katsuragi-kun? I see,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as Ichinose heard Katsuragi’s name, she seemed to immediately understand. Machida politely explained in more detail to Yukimura and the others, who still didn’t get it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are only four possible outcomes. You all should know what those are. Consider. Which outcome do you think we should absolutely avoid?” asked Machida. He turned toward Karuizawa, as if choosing her to answer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Umm. The outcome where someone figures out the VIP’s identity and then betrays the group?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. If a traitor emerges, that will be our downfall. Whether the traitor discovers the person or not, we lose. But what if we flip things around?” asked Machida. This time, he looked to Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There won’t be any negatives, you mean?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Exactly. There are no consequences in the two remaining outcomes. Our class points won’t rise or fall much. However, we’d gain a lot of private points. The only one who suffers in this scenario is the school. So there’s no need to try finding the VIP. If we talk, we’ll start suspecting someone of being the VIP, and then someone might make a mistake,” said Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I do see what you’re saying. But if we don’t know which class the VIP belongs to, the point gap between classes could be widened further. What if the VIP’s identity is extremely biased, and all VIPs are only chosen from one or two classes? That class would get millions of points. Although our class points won’t be affected, I’m sure everyone understands the importance of private points,” responded Hamaguchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHamaguchi was onto something. Private points were a hot commodity at our school. They could be used like pocket money, but also could purchase test grades. Depending on the situation, they gave you the power to do almost anything except move between classes. Hamaguchi asserted that as long as we didn’t know how the VIPs were distributed between the classes, we shouldn’t carry out such a strategy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, his argument wasn’t really going to work for Class A. After all, we were dealing with Katsuragi, who must have realized the test’s “trick.” Otherwise, he wouldn’t have suggested this strategy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Think about it. The school wouldn’t distribute the VIPs unfairly. They hate unfairness so much that they emphasized their commitment to fairness even before the test began. The fact that there is only one VIP in each group is not that important. What’s important is that all classes have equal opportunity to produce VIPs. Otherwise, the test would be unfair right from the start. Is that possible? No, it’s not. After all, the previous test on the island was fair, wasn’t it? There’s no doubt that Classes A through D are starting equally,” Machida responded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi proposed that the VIPs had been distributed fairly amongst the groups. His plan was to let the test pass calmly so that all classes would receive the same number of points. However, Hamaguchi wasn’t done.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s certainly true that the school has made a point of emphasizing its commitment to fairness. If we believe that, then you’d be right,” he said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe school probably wouldn’t be so careless as to inadvertently favor one class. That much was easy to guess.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you understand it now. If we talk amongst ourselves, we create doubt, which will tear us apart. As a result, our relationship as a group will crumble. We certainly could discover the VIP, but that strategy could inspire a traitor who wants victory for him or herself. There’s really no need for us to overthink things,” said Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I suppose so. It’s not a bad thing if the school is the only loser,” replied Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose seemed receptive to Katsuragi’s strategy. Machida looked as if he’d expected her agreement, but Ichinose wasn’t done.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“However, it’s going to be unexpectedly difficult. It might even be more difficult than solving the test through discussion. If you don’t doubt your partner, you won’t betray him or her. All the first-year students would have to adhere to that. Because the school guarantees the VIP’s anonymity, you’re asking for trust amongst your classmates. It’d be great if the VIP stepped forward and the points were shared equally with the class, but couldn’t the VIP just monopolize all of those points?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We in Class A have established complete trust amongst ourselves. We’re not at all worried about that. Private issues ought to be solved by that private group,” answered Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi’s pl
