aked from the waist up, was doing push-ups. He was soaked with sweat, but didn’t seem bothered at all. No ordinary high school student could pull that off. He really was exceptional in every way. Honestly, I wondered if Kouenji was even participating in this test. Hirata seemed to guess my thoughts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eparticipating in a group. After all, students are required to participate, and points are taken away if a student fails to participate,” said Hirata. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTrust Hirata to read the rules thoroughly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To tell you the truth, I got word that two of our classmates have been selected as the VIPs in their groups,” he whispered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Who?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… I can’t say. They only told me because they trust me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So you can’t trust us, Hirata? If you know, then I have the right to know, too. Besides, if you know who a VIP is, that might give us some kind of hint. We should all be sharing information with each other in the first place. It’s only natural, after all,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, you’re right. That’s why I wanted to consult with you. It’s just that—” Hirata started.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Hirata. Wouldn’t it be better to give us that information by phone? We don’t know who’s listening in on our conversations,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you’re right. Wait just a moment.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwo names showed up on Hirata’s phone. He turned the screen to us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDragon Group, Kushida-san. Horse Group, Minami-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eImmediately after I saw the names, Hirata erased them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see,” murmured Yukimura. He was careful not to say too much. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo Kushida was the VIP. Having that position in the extremely well-stacked Dragon group meant they had an enormous advantage. However, being the VIP was terrifying. Once they knew her identity, she was at their mercy. If the VIP had been from another class, we wouldn’t have taken the brunt of the damage even in the worst-case scenario.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. Everything is all right,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe’d noticed I was worried. The three Class D people in the Dragon group were the best we had to offer. They’d never be careless enough to reveal the VIP’s identity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Speaking of Rabbit Group, it’s equally possible for the VIP to be from any of the four classes. So in Class D, there are two VIPs that we know about. There should be one more VIP keeping his or her identity secret,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. I think your logic follows. They certainly haven’t talked to me about it, but they might’ve consulted someone else. After all, there’s a high risk of being discovered if you talk,” Hirata said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhile we talked amongst ourselves, Kouenji started humming. Yukimura, who’d been patient up until that point, bolted out of his chair in frustration. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Kouenji, stop the happy-go-lucky act already! I’m not going to tell you to take things seriously, but you need to at least participate. We don’t want you to screw everything up like you did back on the island,” he shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I couldn’t exactly help it. I was in awful shape. I couldn’t force myself to do the impossible,” answered Kouenji.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You just faked being ill to get out of it!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My, this test will be nothing but troublesome,\u0026#160;wouldn’t you say?” Kouenji sniffed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe continued his push-ups, then stood gracefully. He grabbed the towel from his bed and started wiping his\u0026#160;neck.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Troublesome? You’re not even thinking about this test at all!” countered Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there isn’t any point to continuing a test that isn’t interesting, is there? Finding a liar is simple.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji, phone in hand, started to fiddle around. Soon after, all four of us, including Kouenji, received a notification from the school on our phones.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What did you just do, Kouenji?!” shouted Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata and I read over the email we’d just received from the school. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e“The test has now ended for the Monkey group. Those in the Monkey group are no longer required to participate any further. Please do not disturb the other students.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Monkey Group? Hey, that’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e group, Kouenji!” shouted Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. And now, I finally have my freedom once again. Adieu.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe tossed his phone aside before slipping into the bathroom. The rest of us were simply dumbstruck.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Y-you’ve got to be kidding me! We’re desperately trying to think of a way out of this, and that guy, he just…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We still don’t know anything yet. He probably had his own ideas,” replied Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re being way too generous! That guy will screw anyone over, so long as he’s able to enjoy himself and take it easy. This sucks!” shouted Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, Kouenji didn’t take the test seriously at all. That was true. However, he was remarkably perceptive and observant. He had boldly stated that the test was nothing more than a “simple quiz” to find the liar. If that were true, he’d probably hit the mark. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji’s sudden actions soon became known to the rest of the students. Hirata’s phone started to beep continuously as new notifications poured in. Classmates were desperate to know what’d happened. Katsuragi, Ryuuen, and Ichinose would all be surprised by this. Probably no one had imagined that someone would turn traitor so soon. Horikita messaged me:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m sorry. Things seem really confusing right now. I’m going to give you a call.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Damn it. Thanks to Kouenji, things have escalated,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m stepping out for a bit,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura seemed like he was so irritated he wouldn’t be able to sleep. I stepped out of the room. Even though the test had ended for Kouenji, I couldn’t dwell on that. To be honest, I was seeing my own limitations in this test. No matter how much I schemed, it would be extremely tough to lead the Class D students from all the remaining groups to victory. You could even say it was impossible.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the students came together, we could do something. Otherwise, we were beyond help. We had no connection. You couldn’t interfere with another group’s answers using your own phone. There wasn’t enough time to find another method, and the risk was high. If I had some information that could decisively turn everything around, that would be another matter. The ringleaders were Hirata and Kushida. If I could use them…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s impossible,” I muttered. There were three days left. Even if I did manage to gain their cooperation, I still didn’t have enough eyes and ears. I needed to understand what was going on in each group’s discussions. Of course, I might still be able to use Horikita and Sakura, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell. Right now, I needed to get more eyes and ears on my side.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.6\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eT\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehe starry skies stretched out before me as far as the eye could see. I wandered around, and stumbled onto the deck.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wow, that’s amazing.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe view was more beautiful than anything I had seen in a movie or envisioned in a book. It was the kind of sky you couldn’t see in a large city. There were a few couples holding hands, looking up to the stars shoulder-to-shoulder. I felt a little lonely. Because there was almost no light, I couldn’t make out their faces, but I didn’t particularly care. I wasn’t interested in other people’s romances.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut amongst all the couples, there was one student looking up at the starry skies alone. A girl, judging by the silhouette.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t just walk up and say something like, “Why don’t we look at the stars together?” I’d probably come off sounding like one of those sleazy pick-up artists. Besides, if a boyfriend came along and joined her in the middle of me making a move, it would be bad. But part of me was interested in discovering her identity. I tried getting a little closer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe girl turned toward me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Oh, Ayanokouji…kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That voice… Kushida?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida stepped out of the shadows. She looked at me with an expression of shock.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you…alone?” I asked. Perhaps she was waiting to meet her boyfriend. Just imagining that made my chest tighten and ache.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I am. I just couldn’t seem to sleep.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I see,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, now I knew she wasn’t on a starlit date. In that case, I figured she wouldn’t mind, so I got closer. Kushida wore a jersey. She must have just gotten out of the bath, because she smelled nice. It should have been the scent from the complimentary shampoos in our rooms, but it wasn’t. How mysterious.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aren’t you cold?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m fine. What about you, Ayanokouji-kun? Are you all alone?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI nodded. When I did so, Kushida laughed happily.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So we’re both alone? I admit, I felt a little ashamed being alone. This makes me feel better.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI should’ve spouted off a witty one-liner. But I couldn’t. Besides, being alone with Kushida in a place with a ton of couples spiked my heart rate. Deep down, though, Kushida must’ve been thinking how much she hated this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m gonna head on back,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re already leaving?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m getting tired.” That was a total lie. I didn’t want to sleep in the slightest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, I’ll see you tomorrow. Good night, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good night, Kushida.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI turned around and began to make a pathetic retreat.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnexpectedly, Kushida wrapped her arms around my chest. Even in this cold, I felt the warmth of her body through her jersey.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“K-K-Ku…Kushida? Wh-what’s the matter?” I squeaked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, I was completely flustered. It was only natural that I’d panic. I couldn’t understand what was happening.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut Kushida didn’t answer right away. She finally responded in a small voice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. I…I just felt so lonely, I think,” she whispered. Her words hit me hard, like a fighter smacking me right in the jaw. I felt dizzy. Kushida buried her face in my chest for a few seconds longer, without saying a word. Then she pulled away, flustered, as if breaking from a spell.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol4_INTERIORILLUSTRATIONS_6\" src=\"/hola-lector-agua/images/books/v4/OEBPS/Images/ClassroomElite-Vol4_INTERIORILLUSTRATIONS_6.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sorry. I, um…I just hugged you so suddenly, Ayanokouji-kun. Good night!” she stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t make out Kushida’s face too well in the dark, but she might have been blushing slightly. Kushida quickly scurried away before I could speak. I stood there, hand on my chest, feeling the warmth that remained. I already couldn’t sleep, and after all that, I couldn’t just return to my room. I decided to wander around the boat before heading back.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now that I’ve calmed down, I’m feeling thirsty.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere should’ve been a few vending machines on the first level, so I decided to head there. But as I approached, I found an odd three-person group: Chabashira-sensei; the Class B homeroom teacher, Hoshinomiya-sensei; and Mashima-sensei from Class A.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe teachers were relaxing on the sofa. The area wasn’t technically off limits to students, but since things like izakaya and bars weren’t open to us, no one came around. I’d taken this route just for a change of scene, but had stumbled onto an opportunity. I hid myself and drew nearer.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, it’s been a long time since the three of us all got together.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It is what it is. Fate. After bouncing around from one thing to the next, we all chose the teacher’s life.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enough. There’s no point talking about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, that reminds me. You were on a date the other day, weren’t you? You’ve got a new girlfriend, huh? Mashima-kun, you’re quite the playboy. And here I’d thought you were the quiet, unsociable type.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Chie, what happened to the man you were with?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah ha ha! We broke up two weeks ago. I’m the type of girl who breaks it off once the relationship starts getting serious. It’s just like, see ya later!” Hoshinomiya-sensei said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what you’d usually hear from the guy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, but I’d never do that to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, Mashima-kun. You’re my best friend, after all. I’d hate to ruin our friendship.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Relax. I’m not worried about that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What a shocker.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHoshinomiya-sensei poured whiskey into an empty glass. She downed it in one gulp. Must’ve been a drinker. On the other hand, Chabashira-sensei sipped her drink like a cocktail.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you planning, Chie?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What are you talking about? What’d I do?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s customary to place all of the class representatives into the Dragon group, isn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not screwing around or anything. It’s certainly true that as far as grades and attitude are concerned, Ichinose-san is number one. However, someone’s true place in society cannot be measured by numbers alone. I determined that she needed a challenge. And besides, rabbits are just so cute, aren’t they? The way they hop around. Doesn’t that suit Ichinose-san?” Hoshinomiya-sensei asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hope you’re right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think what you’re saying makes sense, Hoshinomiya, but what are you getting at?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We wouldn’t want you to base your judgment on personal grudges.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, are you still talking about what happened ten years ago? I thought that was all water under the bridge.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder. I mean, you can’t seem to stop yourself from running your mouth. You’re not satisfied unless you’re one move ahead. That’s why you put Ichinose in the Rabbit group, isn’t it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I genuinely thought that Ichinose needed to learn a lesson, so I removed her from the Dragon group. You know? By the way, Sae-chan, I couldn’t help but notice you’ve been focusing on Ayanokouji-kun. Anyway, it’s just a coincidence. Coincidence, coincidence. When the island test ended and Ayanokouji-kun became a kind of leader, you weren’t surprised at all, were you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see.” Mashima-sensei nodded as though convinced of something. However, he then strictly addressed Hoshinomiya-sensei. “There’s no rule against this, but I want to be clear. Stop spying on other colleagues’ classes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Agh, it’s like you don’t trust me at all. Well, I’m not the only one to blame. Sakagami-sensei is part of the problem, too. If we evaluated the Class C students properly, another student should’ve been placed into Dragon. But they threw Ryuuen in there.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s certainly true. This isn’t your average year. The students seem rather special.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith this newfound information, it was about time for me to head back. If I stayed any longer, I might be seen. Just knowing that Ichinose had been sent to spy on me was enough for this little reconnaissance. Apparently I was under heavy scrutiny.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol4_INTERIORILLUSTRATIONS_7\" src=\"/hola-lector-agua/images/books/v4/OEBPS/Images/ClassroomElite-Vol4_INTERIORILLUSTRATIONS_7.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$L12\",null,{\"content\":\"$13\",\"title\":\"Chapter 3: An Infinite Variety of Wishes\",\"volumeId\":\"v4\",\"chapterIndex\":9,\"prevChapter\":{\"volumeId\":\"v4\",\"chapter\":8,\"title\":\"Chapter 2: The Gentle Days…\"},\"nextChapter\":{\"volumeId\":\"v4\",\"chapter\":10,\"title\":\"Chapter 4: Double Question\"},\"toc\":[{\"label\":\"Table of Contents\",\"href\":\"Text/TableOfContents.html#tableofcontents\",\"index\":2},{\"label\":\"Character Gallery\",\"href\":\"Text/section-0001.html#auto_bookmark_toc_top\",\"index\":3},{\"label\":\"Table of Contents Page\",\"href\":\"Text/section-0002.html#auto_bookmark_toc_top\",\"index\":4},{\"label\":\"Title Page\",\"href\":\"Text/section-0003.html#auto_bookmark_toc_top\",\"index\":5},{\"label\":\"Copyrights and Credits\",\"href\":\"Text/section-0004.html#auto_bookmark_toc_top\",\"index\":6},{\"label\":\"Chapter 1 - Prologue : Karuizawa Kei’s Soliloquy\",\"href\":\"Text/section-0005.html#auto_bookmark_toc_top\",\"index\":7},{\"
