an was to play defensively, almost like he was putting up barriers. In order to pull off his strategy, he’d need the cooperation of everyone in the group, a difficult proposition. However, it really was a simple plan that anyone could pull off. All it required us to do was not talk. You could say that this strategy was a way to break the test.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t Class A’s strategy fine, though? I cannot say that I can find any problems with it. Once the exam ends, the classes can talk amongst themselves and share the points,” said the Professor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Professor, for some reason, had gone back to using his normal nerdy tone. Something must have resonated with what he said, because his sentiment spread to Class C. A girl named Manabe shared his opinion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree. Everyone sharing the same answer would be the most rewarding result, but if anyone lied or betrayed us, we’d be doomed. Finding the VIP just isn’t realistic.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura was lost in thought, but didn’t seem opposed to the idea. At least, he wasn’t able to express an opinion. Conversation really posed a high degree of difficulty. Machida, feeling lessened resistance, smiled and showed off his white teeth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. So, do we agree it’s as Machida-kun says? Each individual class can deal with the problem after the test has ended?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eArms crossed, she looked over Classes D and C.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’d like everyone’s opinions. Would that be all right? First, those who agree with the plan, please raise your hand.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura and the Professor raised their hands. All the students from Class C, looking somewhat troubled, raised their hands as well, though some took more time to think than others. Ibuki was the sole holdout, her arms crossed as they had been since the beginning of the test. She didn’t move. She didn’t speak.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about you, Ibuki-san? If it’s all right, I’d like to hear your thoughts as well,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Whatever. I don’t really have anything to add,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe clearly stood apart from the other three Class C students. Manabe and the others didn’t appear surprised by or suspicious of Ibuki. That must’ve just been how she acted normally.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. Well, what about you, Karuizawa-san?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… To be completely honest, I’m annoyed. Even though you say we’ll get points, whether \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eget any points is a separate issue. But we may get points even if we do have a discussion… I don’t want to waste time fighting over what we’re doing. I just want this test to be over so we can have fun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other students seemed astonished by her response.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What about you, Hamaguchi-kun?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We leave everything to you, Ichinose-san,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like the trust Ichinose’s class had in her was unshakeable. The other two students from Class B nodded in agreement.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you. Lastly, we have one more person to ask.” Ichinose turned to me. “What do you think, Ayanokouji-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I mean, the strategy’s fine. Besides, I think most people here agree, and I’ve never been good at talking,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI promoted accepting the strategy. However, I doubted that Ichinose would just accept Katsuragi’s plan so easily. No, if she just gave up and went with the flow, Class B would be headed toward a dark end. Katsuragi’s strategy was hiding something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s decided,” said Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. Machida-kun. Katsuragi-kun’s strategy certainly isn’t bad. With it, there’s no need to doubt, lie to, or hurt anyone. In the end, we’d receive an equal number of points. I understand the reason why many would follow this plan. However, I want you to consider something carefully. I can’t think of any downsides to this strategy, but wouldn’t you say that being in Class A allows you to propose such a strategy? There may be downsides we don’t see yet,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose’s comeback was swift and incredible. She was like a submarine everyone thought was deep underwater, only for it to suddenly surface without so much as a splash.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A hidden downside? What in the world could that be?” asked Yukimura, sounding flustered. It didn’t seem he’d considered that point yet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we assume that the classes all have an equal number of VIPs, then I do certainly think it’s possible to earn a large number of points equally across the board by not holding discussions. If that’s true, this plan has only upsides. However, wouldn’t it be unfair to the lower level classes to make them throw away this chance?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, that’s—” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We don’t know how many special tests we’ll have before graduation, and the difference between Class A and the rest is remarkably clear. Class A also proposed the extreme idea of aligning all the classes back on the island. If Class A continues to recommend this strategy every time we have a test, our class positions will never change,” Ichinose continued.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Ichinose pointed out that fact, Yukimura’s face visibly stiffened. It was like he wondered how he could have missed such a simple thing. Machida had cleverly constructed his proposal to focus everyone’s attention only on the idea of “loss and gain.” Yukimura had thought that option was better because he couldn’t see the bigger picture.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t just throw away a precious opportunity. Not even if your strategy yields solid results,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We agree with Ichinose-san,” said Hamaguchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, Ichinose. I understand what you’re trying to say, but if we follow along with what you’re proposing, there’ll be only one possible outcome. Only if everyone answers correctly will everyone in the group get a large number of points. The outcome you want isn’t going to happen. Or do you intend to discover the VIP’s identity through discussion, and then have Class B betray the rest of us? You just asked everyone if they wanted the first outcome. You aren’t very trustworthy, wouldn’t you say?” countered Machida.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You said this wouldn’t narrow the gap between classes, but that’s not correct. There are four students from Class D, and four from Class C in our group. There are three from B and three from A. In other words, if we clear the test with the first outcome, it’s possible for the lower classes to close the gap between themselves and the higher classes, wouldn’t you agree?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s true. But would B, a higher-level class, accept such a thing? There’s no benefit to sacrificing your class so that the classes \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ebelow\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e gain something,” Machida said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If we don’t follow my strategy, we let Class A lead unopposed. It would be especially hard in the event that the VIP happened to be in Class A,” responded Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, if the VIP wasn’t in Class A, Ichinose wouldn’t need to risk hurting her own class to deal a blow to Class A. However, if it was a possibility, she had to insist on establishing a dialogue.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree. We can’t allow Class A to keep securing the lead,” added Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi’s proposal had surprised me, but Ichinose and Hamaguchi’s arguments made it seem like nothing more than a flustered attempt at a bluff—something they’d come up with on the spur of the moment. Ichinose’s understanding of Class A allowed her to turn things around with just a few words. The students who had once agreed with Class A’s plan were now mostly either neutral or aligned with Ichinose. Classes C and D were now more likely to follow her. It was like a duel between Class B, led by Ichinose, and Class A, led by Machida. Right now, the tide was turning in favor of Class B.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, you oppose our proposal. Please remember that Class A has already committed to its decision. No matter what, we will discuss anything. You may talk amongst yourselves about whatever you wish,” Machida answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs a demonstration of their separation, the three Class A students stood and went to the corner of the room. It looked like they planned to spend the rest of the time doing what they wanted. I was betting that the other Class A students in other groups were probably doing the same thing. Katsuragi’s strategy was the ultimate defensive move: something that would keep all of Class A behind a gate. If a VIP happened to be in Class A, it would be exceptionally difficult to find him or her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, what should we do?” Ichinose faced the other three classes, who were still sitting around in a circle. “I wanted to avoid excluding anyone, but there’s nothing we can do if that’s your class policy. If you want to participate, just let me know,” she said gently.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, the Class A students had already lost interest.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t it going to be impossible to find the VIP without their help?” asked Yukimura, flustered by the sudden change. It sounded like he was complaining to Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHis attitude had changed from a few moments ago, when he was ready to go along with the more convenient Class A plan. Even Yukimura had wanted to avoid Class D getting the short end of the stick. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. If Rabbit’s VIP is in Class A, trying to narrow down the list of suspects won’t be easy. But in terms of sheer probability, there’s a three in four chance that the VIP’s in one of the other classes. Besides, even if we don’t know \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewho\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the VIP is, if we at least know \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewhere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e that person is, we’ll have some options. Right?” asked Ichinose. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe didn’t seem focused on finding the VIP right off the bat. Instead, she wanted to first narrow down which class the VIP was in. At least, she wanted to know for sure if he or she was in Class A.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, since they won’t talk to us, this is going to be difficult. However, if the VIP does happen to be in one of the other three classes, I think everything should be fine even if they don’t out themselves. However, if the VIP’s in Class A, what do you think we should do?” Ichinose was boldly striking back against Katsuragi’s strategy. She was trying to form an alliance.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can’t trust you,” muttered Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Yukimura rejected the offer, Manabe from Class C spoke up and also refused Ichinose’s plan. “Even if the VIP’s in Class A, would we be able to identify them? Wouldn’t that be difficult?” she asked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think it’s necessary for us to think that far ahead. Let’s just start by finding out which class the VIP is in,” replied Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom the VIP’s perspective, three classes coming together to find you was probably terrifying. If they were on their own, or if they had a friend from another class, they really should consider the idea of cooperating with the search in order to blend in.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This is just a spur-of-the-moment idea. If we work together, we’ll come up with even better ideas later. The test’s only just begun. I think it might be better to wait a bit and take our time before deciding whose plan we’ll move forward with,” Ichinose added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThose who’d rejected both Machida’s and Ichinose’s plans had no third option. As Hamaguchi had said, it wasn’t fair for people to complain without first suggesting a plan themselves. At any rate, I decided to lay low\u0026#160;until I saw how others acted. People with low communication skills tended to be highly reactive; they’d act before thinking. I couldn’t afford to get impatient. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, you’re Karuizawa-san, right? There’s something I wanted to ask you,” said Manabe. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa quickly looked up from her phone screen. She hadn’t expected anyone to talk to her. “What?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I might be mistaken, but…did you have a fight with Rika earlier in the summer?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What are you talking about? Who’s Rika?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s a girl from our class who wears glasses. She has her hair up in a bun, like a dango. Remember her?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know her. Maybe you’re thinking of someone else.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa lowered her eyes back to her phone, as if deciding this conversation had nothing to do with her. However, the next words out of Manabe’s mouth changed things.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t that strange, though? I’m sure we heard about it. We heard that Rika was bulled by a Class D girl named Karuizawa. Rika told us you cut in line and pushed her aside when she was waiting at the café.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what you’re talking about. Like, do you have some kind of problem with me?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, not really. I’m just checking to see if it’s true. If it \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e true, though, I’d like you to apologize. Rika is the kind of girl to bottle everything up and stay quiet, so it’s up to us to help her deal with situations like this.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently Karuizawa had a reputation as a troublemaker outside our class as well. Class C was hard to deal with as a whole, so this made for big trouble ahead. Karuizawa decided to ignore Manabe. Manabe, looking frustrated, turned her phone’s camera toward Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You won’t mind if we check with Rika then, will you? I mean, if it wasn’t you, Karuizawa-san, then there won’t be any problem, right?” asked Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa looked up and knocked the phone out of Manabe’s hands. She must have done it more forcefully than she thought, because Manabe’s phone tumbled to the ground, spinning as it fell. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What the hell?!” shouted Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s what \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e should be saying! Don’t just take pictures of me without permission. I already told you that you had the wrong person,” Karuizawa snapped.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBoth sides claimed the other was wrong. The conflict was heating up. Ichinose watched it unfold, a bystander. It was as if she was trying to determine who was right and wrong.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’ll you do if my phone’s broken?” shouted Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know! Just ask the school for a new one,” answered Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have some really precious photos stored on that phone, though.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter hurriedly picking up her phone, Manabe glared at Karuizawa with resentment. Two of the other Class C students, who’d been watching the situation unfold, came to help Manabe stare Karuizawa down.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What? Are you saying \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e the bad guy here?” asked Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it wasn’t you, you wouldn’t get all angry and deny it like that, right? Let us take your picture,” said Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I don’t want you to.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought that Karuizawa would’ve answered Manabe more forcefully, but her words were surprisingly weak. Or rather, there was some fear mixed in with her “tough girl” act. It might’ve been my imagination, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Perhaps the reason you’re denying it so much is because it’s true?” asked Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabe pointed her phone’s camera at Karuizawa, as if intending to forcefully take her picture. The other two girls from Class C laughed like they were enjoying it. However, Ibuki didn’t share their sentiment. She looked scornfully over at Manabe, showing her contempt.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Stupid,” said Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘Stupid’? What? This has nothing to do with you, Ibuki-san. You’re not friends with Rika, after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right. This absolutely has nothing to do with me. So I said what I thought as an outsider.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIbuki crossed her arms and looked away. Manabe didn’t appear to care for Ibuki’s attitude at all, but did not confront her. There was probably a clearly established hierarchy in Class C, and Ibuki was above Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyway, just let me take your picture!” shouted Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, I don’t want you to! Come on. Please, say something to her,” Karuizawa pleaded. For some reason, she turned to Machida, begging him to intervene. “I won’t forgive you if you take my picture without permission. What do you think, Machida-kun?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I agree. Manabe, Karuizawa has told you that she doesn’t want you to take her picture. Stop it,” Machida added.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“M-Machida-kun, this has nothing to do with you,” answered Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From what I’ve heard just now, I think you’re the one in the wrong here, Manabe. Karuizawa told you she doesn’t know what you’re talking about, so it’s wrong for you to forcefully take her picture. Don’t you agree? I\u0026#160;think it’s best to talk to your friend again and confirm if the story is true.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJudging this situation fairly, Machida was correct. I\u0026#160;certainly understood Manabe’s feelings in wanting to take the picture to ascertain the truth, but if the person tells you no, taking a picture without permission is rude. Confronted with that argument, Manabe and the other girls had no choice but to back down, though Manabe didn’t seem wholly convinced.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Come on, lay off me. Thank you, Machida-kun,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa looked up at him, her eyes full of gratitude. Even though the Class A students had distanced themselves from the rest of the group, they weren’t bad guys at all. Takemoto and the others didn’t appear to be too interested, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“All I did was the right thing.” Machida blushed slightly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePerhaps this was the beginning of a new love? Karuizawa already had Hirata, though. Regardless, I got the feeling that the friction between Karuizawa and those Class C students would spark some real problems down the road.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003en the end\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003enothing was settled, but at least we’d spent the hour in discussion like we were asked to. The announcement came that we were free to go. The students from Class A all gathered together and left right away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you’re free to do whatever you like,” they told us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter they’d marched out the door, silence enveloped the room once again. Ichinose had dismissed Katsuragi’s strategy, but hadn’t managed to reach a new resolution. Was she hiding something else up her sleeve? Or was she thinking of something else, perhaps? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eLet’s see what you’ve got, Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we have five more discussion periods left. How about we bring this session to a close?” Ichinose spoke kindly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe consensus seemed to be that it was better to spend some time on our own before meeting up again to discuss. We’d all taken in quite a bit of information and hadn’t had the time to process just yet. At the very least, the Class D members were exhausted. The Class C students seemed to be in the same boat. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’m going to head back—Aaah?!” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa, completely exhausted, got up to leave but accidentally pitched forward. Perhaps her legs were numb from sitting for so long.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ouch!” shouted Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn a panic, Karuizawa had attempted to correct her footing, but staggered and stepped on Manabe’s foot. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I didn’t mean to do that. I’m sorry,” Karuizawa mumbled, apologizing quickly before leaving the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, what the hell?!” shouted Manabe. She yelled at the rest of us as we left. I didn’t want to get caught in the middle of anything, so I averted my eyes and got out of there. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, we’re heading back, too. I want to talk to Hirata about some things,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe other classes were already making their moves. Yukimura seemed like he wanted to hurry up and start a discussion about our own strategy. To be honest, our class didn’t boast a ton of competent planners, so it was a difficult decision. The Professor stood up slowly. In the end, the last people left in the room were the three Class B students and Ibuki.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m hungry again. I wonder if there’s a lunch buffet,” mused the Professor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHow could he already be hungry again? \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWhat kind of body lets you digest all that food in just an hour?! Besides, if you eat that much, you’ll get fat.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I kind of doubted that my heartfelt advice would reach him, though. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Yukimura. Wasn’t Karuizawa acting strangely?” I asked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“She’s always acting strangely,” he replied.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, that was a straightforward and honest response, but not exactly what I wanted to hear. I wasn’t sure what, but something felt off about her. Maybe I didn’t really know her at all…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Professor didn’t seem to have noticed anything in particular. In fact, he forgot it’d even happened. My phone had been turned off in the room so I wouldn’t be distracted. I turned it back on as we left, and noticed an instant message from Sakura. She wanted to meet if we had time.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. Perfect timing,” I murmured.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wanted opinions from people other than Hirata and Horikita. I wanted to hear what they thought about this strange test. I’d probably gain insight after learning more about Sakura’s group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let’s see, where should we meet?” I asked aloud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought the same place as yesterday should be fine. When I pitched that idea to Sakura, I immediately received a confirmation. There were going to be lots of students around right now, but they probably wouldn’t pay any attention to us. Loners learned the art of dealing with crowds.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the first group discussion had just ended, the elevator was going to be intensely crowded. Because only about ten people could ride at a given time, it’d be faster to just take the stairs. I made my way toward the deck. On the way, I received a new instant message:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSince there are so many people around, I’m going to head to the bow instead. I’m sorry\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah. Guess she couldn’t deal with the crowds after all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI made my way toward the bow. The ship’s interior had many luxurious facilities, but toward the bow there was only a large deck, which provided a good view of the water. Because of that, it was usually quiet. There didn’t seem to be anyone else around, which meant I had the entire deck to myself. Sakura was waiting for me, standing behind a pillar in the corner. Deciding not to shout in case I spooked her, I approached slowly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I was thinking about it, but…h-how do I do it?” she murmured out loud.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHmm? As I drew nearer, I heard Sakura muttering to herself. She spoke in a quiet voice, and it was hard to hear her over the wind. I couldn’t make out what she was saying too well.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I…wanted to…d-d-d-da…” she stammered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought she might be talking to someone, but there was no one else around. She didn’t seem to have her cell phone out, either, so the whole thing was a little creepy. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sakura? What’s the matter?” I asked, trying not to surprise her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Aaaieeeeeeeeeeee!” Sakura yelped, practically jumping out of her own skin. Seemed like I’d surprised her after all. “Wh-wh-when did you get here? How much did you hear?” she asked frantically.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol4_INTERIORILLUSTRATIONS_5\" src=\"/hola-lector-agua/images/books/v4/OEBPS/Images/ClassroomElite-Vol4_INTERIORILLUSTRATIONS_5.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I didn’t really hear anything. I just got here now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo one else was around. She was like a frightened little animal.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHad Sakura been talking to a ghost, or had she lost her mind? I wasn’t sure which.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Were you listening?! Did you hear what I was saying?!” Sakura shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I only heard bits and pieces. I have no idea what you were talking about,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura appeared relieved.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, why did you call me out here?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um, well. You see, it’s…ah… I was s-stressing out over the test!” she shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura, looking incredibly depressed, handed me a list. I read over the names written on it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCLASS A:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Sawada Yasumi, Shimizu Naoki, Nishi Haruka, Yoshida Kenta\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCLASS B:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Kobashi Yume, Ninomiya Yui, Watanabe Norihito\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCLASS C:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Tokitou Hiroya, Nomura Yuuji, Yashima Mariko\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCLASS D:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ike Kanji, Sakura Airi, Sudou Ken, Matsushita Chiaki\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt looked like the other Class D students assigned to the Cow group were…intense. Considering the boys in her group, like Sudou and Ike, I couldn’t help but feel sympathy for Sakura. During this test, you had to spend time with the other members of your group no matter what. I’d have liked to help her out a little bit, but there was nothing I could really do. Once it was time for the groups to come together, we had to be part of our teams. We couldn’t afford to be scattered. I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e help her secretly, but if I acted unnaturally during the test, someone would immediately notice. In a test like this, breaking the rules could mean death.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I thought I might know someone from another class but…amazingly enough, I don’t know anyone. No one who would remotely consider me a friend,” said Sakura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried thinking about it, but the only people who could help were Ichinose and Kanzaki. But since Ichinose was already in my group, she was stuck. I couldn’t really leave it to Sudou or Ike to take care of Sakura, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry. I don’t really have any friends, either,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, it’s okay. You don’t need to apologize. It’s just that…I don’t have \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eany\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e friends!” Sakura responded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was a pathetic conversation, the two of us competing to see who was worse off. Rather than take pride in our lack of friends, I changed topics. “By the way, there was something I wanted to ask you, Sakura.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Me? What is it?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Has Yamauchi gotten in touch with you at all since the discussion ended?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yamauchi-kun? No, he hasn’t. Is something the matter?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, I see.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring the test on the island, I’d indirectly used Sakura while I was also using Horikita. I’d manipulated Yamauchi by taking advantage of his crush on Sakura, promising him Sakura’s email address. Of course, I hadn’t intended to give Yamauchi her email address without her permission, but I hadn’t talked to him about it yet. I was worried that he might’ve reached out to Sakura in the aftermath, but apparently it was all right. Since I’d planted the seeds myself, if Yamauchi made a move, I would have to act. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the time being, contact me if something’s bothering you. You can tell me anything,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Is that okay?” asked Sakura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. That’s the least I can do.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I didn’t know how much help I’d be, Sakura’s eyes sparkled like a child’s. Maybe she was just glad to be able to talk to someone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll definitely contact you!” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sure,” I responded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura was a little different from her usual self. She was overjoyed, and had a bit more vigor behind her words than usual. Maybe she was becoming a little more assertive or something? Even though only a few days had passed since the test on the island, Sakura was developing quickly. It had been an insane test, but maybe it changed her life in unexpected ways. She hadn’t transformed completely, but I sensed she had learned to stay positive and keep going in a tough situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“A\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eaaaaaayaaaaaanooooookooooouuuuujiiiiii!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs soon as I went back inside the ship, a shadow loomed over me. I felt hands grabbing me, and the mystery assailant tightened his grip on my neck. I frantically tapped his arms, but he showed no sign of loosening his grip. I thought that was it for me for a moment. After I shook myself free, I quickly turned around and saw the face of my attacker. It was Yamauchi Haruki, looking like some sort of oni\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e o\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003er an asura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what’s the matter?” I knew the reason, but asked as a formality.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“‘What’s the matter’ my ass! You said you’d tell me Sakura’s email address, for chrissakes! And you were talking with Sakura just now! I knew it. You were after her all along!” he shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, my luck was terrible. I needed to think of something. “I never meant to go after her. Well, this is kind of hard to say, but…I lied to you before,” I croaked. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait. You lied?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you really think that a loner like me would know Sakura’s email address?” I turned toward him, trying to show my sincerity. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So… Wait, so just now you were trying to ask Sakura for her email address?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen I nodded, Yamauchi looked shocked and fell to his knees. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So… You didn’t know her email address at all, Ayanokouji. You \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elied\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e to me?” he sputtered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Sorry.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So how’d it go? Did you get Sakura’s email address?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Er, sorry.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry? What does that mean? I’m not looking for an apology, I’m looking for her email!” Yamauchi muttered to himself, reflecting the depth of his disappointment. “How are you… How dare you trick me!” he shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI did feel bad for tricking him, certainly, but I couldn’t give him Sakura’s contact information without her consent. Since he had obvious ulterior motives, I really had to refuse. “Can you give me just a little more time?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“More time?! ‘Show me a liar and I will show you a thief’!” he shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI never would’ve expected a Class D student to throw out a proverb like that. I was shocked. “Then are you going to make Sakura tell you?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, that’s right.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was probably blinded by anger. It seemed like he intended to get Sakura’s contact information by force, if necessary.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, Sakura said she hates guys that are all talk.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You mean guys like \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyou\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, Ayanokouji?!” he shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course she hates me. But it should be obvious why I couldn’t give you her contact information. I don’t want you to make the same mistake I did, Yamauchi. If you forcibly asked her, it wouldn’t go anywhere. It’d be pointless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re just making excuses. You never knew her info in the first place.” Yamauchi lowered his head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. And I’m sorry. But I know for sure that she doesn’t hate you,” I answered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But what the hell should I do?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you know that Sakura loves digital cameras? I’ve heard that her camera doesn’t work, and she doesn’t have enough points to buy a new one. But what if you got one for her, Yamauchi? If you gave it to her as a present?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, she’d be happy, for sure, but…I don’t have any points, either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, there a few options in this special test. If you were the VIP and managed to make it through without being found out, or if you became a traitor and sold out your group, or if you managed to guide your group to clear the test, you’d get enough points to buy tons of digital cameras. Right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So if I do my best, there’s a chance I can get a new camera for Sakura?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYamauchi was about to burst. He could see the solution to his problems.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now, Yamauchi Haruki, you need to achieve real results. Work hard, and show Sakura how manly you are. Only then would you be a guy who deserves to go out with a former idol.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhatever his ultimate goal, Yamauchi clearly had a crush on Sakura. If I gave him the right stimulus, he could unearth greater potential. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll do it, I’ll do it, I’ll do it, I’ll do it! I’ll give it everything I’ve got and win Sakura!” he shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right, Yamauchi. You can definitely do it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah! I’m definitely going to win!” he shouted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d managed to redirect his energy into participating in the test. If he didn’t get anything out of this, his bitterness and rage might return toward me, but this was a temporary fix. Well, if we managed to secure a surprise victory, everything would be fine…though if Yamauchi was too fired up, he might let the target slip past him. I\u0026#160;worried that he could miss the VIP completely.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Let me tell you something, just in case…” I started. I wanted to urge Yamauchi to be careful, but then refrained from doing so.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nothing. Just do your best. But if you find the VIP, don’t let the other classes beat you to the punch, okay?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf Yamauchi missed the target by mistake, that would probably be fine. The bigger picture was more important than the short term, anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eB\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eecause only\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass A had been promised advancement into higher education or employment upon graduation, we’d never gain their cooperation. Classes B and D had joined hands to defeat Classes C and A, so Classes C and A had likely formed an alliance to defeat us in return. What would happen when the classes came together? It would be dangerous, like putting carnivores and herbivores together in the same cage. It was almost impossible to organize such a group. If people with strong character like Hirata and Ichinose took the lead, it might work. Even then, it would be absurdly challenging. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eClass A didn’t participate in the discussion during our second gathering, either. Of course, with one class absent, we couldn’t really speak frankly, so we had to kill time. I was interested in how students from the other classes would act, but the instability already had everyone holding their breath. We were all so on guard that it was impossible to be candid.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, this is the second time we’ve gathered like this. Don’t you think we should start having open, honest conversation? We’ll only meet so many times,” reasoned Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, Ichinose had taken the lead and got things moving. As expected, she wished for peace. Hamaguchi and the other Class B students were exactly like that, too. They were ready to make alliances without hesitation. It was like how Hirata operated. They were similar, but still fundamentally different. Ichinose and her friends should have been striving for a Class B victory. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eLast time, people were flippant, but now things had changed. The atmosphere was oppressively gloomy. Everyone was jumping at shadows and incredibly wary. However, the three Class A students weren’t bothered by anything, freely tapping away on their phones. There wasn’t any rule against contacting other groups, after all. They could even talk on the phone. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, the old saying was true: the rich are rich, and the poor, poor. Class A was winning the interclass competition by a landslide, so they had no reason to be worried. I\u0026#160;thought their loss during the test on the island would’ve changed them, but Katsuragi had them maintaining their calm image. It was an exceptionally effective strategy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAnyway, it wasn’t going to be easy for a lone wolf like me to break down Class A’s walls. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t think we need a breakthrough right now, but we do need a discussion. Class A might be breaking away from this test, but I think we need to pinpoint the VIP,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura’s words helped motivate us somewhat. If the VIP was in another class, we couldn’t afford to let this chance slip by. Or perhaps he was the target, and Yukimura was suggesting this as an attempt at camouflage. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But can we really find the VIP by talking? I just don’t think we can. It’s just, like, this test is so unfair. It’s too hard. The VIP has way too much of an advantage,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I understand, Karuizawa-san. But doesn’t that just depend on your point of view? I mean, the test on the island was also a surprise to the students,” said Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sunrise?” Karuizawa looked puzzled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If it’s Sunrise, leave it to me! That’s my specialty. I’m fired up!” shouted the Professor.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eNo, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI thought.\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e No, they said “surprise,” not “Sunrise.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You know, life on a ship’s not bad. It’s really fun, right? Even though we have to get together twice a day, we’re still free to chat and use our phones. It’s not like class,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, yeah. It \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e pretty fun,” said Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right? So, that’s why we need to get more comfortable. We need to talk like we’re all friends. Don’t you think it’s hard, putting up walls like that? Machida-kun and the others always look so stern, you know?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose had a point. This was all an issue of perception. If you stayed positive, the test would be easier. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMachida, who’d been listening to Ichinose’s optimism, let out a snicker. “You’re free to do whatever you want, but you probably won’t find the VIP. I don’t know who the VIP of our group is, but if the VIP doesn’t share information, they may be devising a way to gain points for themselves. They’re probably staying hidden on purpose. Besides, the VIP might be in Class B, right? How can you trust these guys?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe was trying to shake us all up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But couldn’t I say the same thing of you, Machida-kun? Can you really trust \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e allies?” asked Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course I can.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMachida looked at the student next to him, named Morishige. However, he quickly focused again on Ichinose, projecting the usual calm, Class A image.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We have no reason to fuss over finding the VIP. We have more than 100,000 points deposited into our accounts every month. No one in our class would lie just to get a mere 500,000.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Really? You know what they say: An ounce of prevention is worth a pound of cure. Are you trying to tell me that no one in your class would want even one extra point? It’s not like the school will be bothered if you get more,” replied Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s stupid. Go ahead and keep being delusional. You’re just grasping at straws.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose smiled at Machida. She’d certainly gotten a response out of him. Even though Machida said he wouldn’t participate in the discussion, he’d taken Ichinose’s bait. If he started talking, we might pull information out of him. By using Yukimura and Karuizawa, Ichinose had started collecting information. The only problem was, when would Machida notice her ploy?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa sighed and went back to fiddling with her phone. While there wasn’t any rule prohibiting phone use during the test, doing so while we were trying to find the VIP was a little rude. Or maybe she was like the CIA or FBI, communicating with Hirata in real time so he could listen to our conversation? I’d respect her if that were true, but it probably wasn’t the case.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, knowing that Karuizawa didn’t usually put serious effort into anything, this wasn’t out of character. But something felt off. It felt like something had been off ever since the test started. Karuizawa; the reunion with Ibuki; confronting Manabe. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI realized that none of the things she’d been doing lately seemed like the “usual” Karuizawa. She was a strong presence in Class D. Whatever her reputation, she and Hirata often brought the class together. But here, she was practically a background character. She had the potential to motivate others, and she wasn’t using it. When someone spoke to her, she would answer and then immediately shrink away. Hirata was always Hirata, no matter the situation, and Kushida was always Kushida. However, that didn’t seem to be true for Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I were to create a hierarchy for the group, she’d be below Manabe and the other Class C girls. Maybe that’s why she was acting strangely. My doubts and suspicions slowly grew.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor Class D to reach a higher position, we didn’t just need to increase our points. We needed to create a system in which we \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ecould\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e increase points. In comparison to Classes A and B, Class D lacked cohesion. And for that exact reason, Karuizawa Kei was irreplaceable. She controlled the rest of the Class D girls. That’s why I was worried about her behavior. I’d thought she’d be more aggressive and dominate the field. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI needed to determine if she was useful or not. Considering that the test period was rather short, I couldn’t afford to take things slow. I needed to stir the pot, even if it meant being forceful.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Class A students immediately left the room at the hour’s end. They were sticking to their class plan and staying quiet for the remaining four discussions. As Ichinose watched the students leave, she gave a heavy sigh.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm. I suppose this is going to be tough. What do you think, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchinose turned to me. She was even calmer, wittier, and clear-headed than I had previously thought. She noticed that I kept quiet during these discussions, but didn’t put me on the spot. If I had been her classmate, I would’ve had a crush on her. She was just that charming. The Class B guys probably weren’t alone in falling for her; she had to have admirers from other classes, too. She probably rivaled Kushida in terms of popularity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be perfectly honest, I’m the type to just sit things out. I’m just a bystander,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s far too soon to give up. Let’s work hard together!” Ichinose seemed determined to do her best.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, even if we keep having these discussions, I don’t think anyone will come out and say they’re the VIP. The benefits of staying hidden are just too great, same as the downsides for being discovered. At this rate, Class A’s worst-case scenario prediction will probably come true,” said Ichinose.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThough her comments sounded negative, she looked fearless. Whatever I felt about her, she was clearly always ready for a challenge.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“At any rate, we’re done for today. Good work, you two.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, we didn’t do much of anything. Well, shall we?” said Hamaguchi.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe change was immediate. The three Class B students relaxed, almost as if someone had flipped their switches to OFF. I still didn’t really know what the deal with them was. I didn’t understand what Ichinose’s and her group’s aims were yet. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, she might have some kind of strategy that she couldn’t tell anyone outside of her group. When Manabe and the others from Class C got up to leave, I\u0026#160;trailed after them. Once they reached the elevator, I meekly called out. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey. Do you have a minute?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eManabe looked slightly on her guard, probably because she hadn’t expected me to come after her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard about your problem with Karuizawa. Something about her pushing someone at the café, right?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. Why do you ask?” snapped Manabe.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThese girls wouldn’t normally want to chat with me, but that topic seemed to interest them. All three focused on me, like they were checking me out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not 100% sure, but I think I saw Karuizawa fight with a girl from another class,” I said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s… Are you sure?” asked Manabe. Her voice was stiff, and she drew nearer. I shrunk slightly and nodded.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I think so. Well, I just kind of got this bad vibe, you know? I felt like she was acting like a jerk, so I thought I’d go ahead and tell you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI kept it vague to set things in motion, and then turned and went back the way I came. Honestly, I hadn’t actually seen anything. If I’d kept talking, I would have probably been exposed as a liar. Now that the fuse was lit, Manabe and the others would react. How would the newly docile Karuizawa respond? I wanted to find out.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e3.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 3.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eheaded back to my room. It was late, so I sat down on my bed without talking to anyone. It was getting close to midnight. I’d thought that everyone would be asleep already, but Hirata looked at me anxiously, like he’d been worried. Yukimura sat on the sofa and faced\u0026#160;me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Good work today, Ayanokouji-kun. You’re rather late,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, a bit. Ah, that reminds me. I wanted to talk to you for a minute, if you have the time.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sure you’re tired, but if you’re up for it, do you mind talking with me?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata and I asked each other the same thing at the same time. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What did you want to ask me?” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh no, that’s okay. You go first, Hirata. We can talk about my thing later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura was trembling, like he was on edge. He probably wanted to talk about the test, too. I changed into my jersey and rejoined them. Hirata moved a bit to give me some space on the sofa. I wanted to talk to Hirata about Sakayanagi, since I figured such a popular guy would likely have information. But I didn’t mind waiting.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I just chatted a bit with Yukimura-kun. We decided to share information about the test,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I did say that it was pointless to include you, Ayanokouji,” added Kouenji. How nice.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I would’ve been glad if Kouenji-kun participated, but he unfortunately declined,” said Hirata.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYeah. I couldn’t imagine Kouenji teaming up with anyone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry, Hirata Boy. I’m far too busy with the pursuit of physical beauty.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji, n
