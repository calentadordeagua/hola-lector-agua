heads after his brief explanation. I was no better. I still didn’t understand anything at all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“As I’ve said, in this test we have divided you all into twelve groups.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFinally, the words that Karuizawa had longed to hear arrived.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are there any questions thus far?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t get what any of this means. Can you explain it in a way that’s easier to understand? I mean, okay, I understand that we’re being divided into twelve groups, but why am \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003etogether with \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethese \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eguys? What about Hirata-kun? Or the other girls? And I still don’t get what we’re doing. Tell me. Come on, please?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though she attempted politeness at the end, I get the feeling she didn’t mean it. However, Karuizawa was right to have doubts. Even though Mashima-sensei said that he was taking questions, the explanation was ambiguous at best. We still didn’t know what commonality there was between the people gathered here.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf each class was divided into three groups, there should have been twelve to fifteen Class D people gathered here for the explanation, but they hadn’t done that. Was it due to the size constraint of the rooms? No, this ship had several rooms that could host a modest-sized gathering. There had to be a reason they’d purposefully sub-divided us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You four gathered here will be in the same group. At this very moment, students in other rooms are receiving the same explanation you are.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWait, so we \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewere\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e members of the same group? In other words, the four of us were allies…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If that’s true, then wouldn’t it be way faster and easier if you just gathered all of our classmates together in one place and explained? Also, what’s the reason for putting me with \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethese\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e three? Why? These guys gross me out. Why am I on a team together with \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eboys\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? Honestly, I hate it…though being with Hirata-kun would be fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa continued blabbing until Yukimura finally seemed to lose patience.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about you shut up and try listening? The test is probably going to start soon. If they dock our points because you keep blabbing, are you gonna take responsibility? Even back on the deserted island, you dragged us all down. Can you try not to cause any more problems?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? When and how exactly did I cause problems? You’re pissing me off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI’d seen guys and girls quarreling with each other many times in the previous test. The Professor and I stayed quiet.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Calm down, you two. Yukimura, your concerns are groundless. The test hasn’t yet begun, so you won’t be affected. Besides, your attitude has no bearing on this test.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSee\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e? Now you get it, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa looked smugly at Yukimura. Yukimura glared in frustration. I should’ve stayed quiet, but I had to say something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa, if you don’t change your attitude toward the teachers, it might leave a mark on your permanent record. That wouldn’t be good, right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmph.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura snorted derisively, mocking Karuizawa without saying a word. Mashima-sensei seemed to develop a headache while watching a fight that would be more appropriate between elementary school students. He lightly tapped his finger to his forehead.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Listen. Your group assignments are a done deal. You cannot change them. To gain a good result on the test, you must get along.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh, jeez! This sucks! I can’t deal with these three! Hirata-kun would have been \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eso\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e much better!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh. But you know, three heads are better than one. Thus, if the three of us join together, we might be able to surpass the good Hirata-dono, my dear lady,” the Professor said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Gross. Even if there were a hundred or two hundred of you, you still wouldn’t be worth a single hair on Hirata-kun’s head.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried not to care, but hearing her say that kind of thing depressed me. Karuizawa clung close to Hirata day and night, except for whenever she was with her girlfriends. It’s true that we really weren’t fit substitutes for Hirata, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ugh. Well, at any rate, I’ll just report it to Hirata-kun later.” Karuizawa let out a frustrated sigh, then averted her eyes again. Trying to work with her was going to be a hassle, but the same was probably true for Yukimura.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Finished? Please let me continue my explanation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay, okay. I understand that we’re being divided into these groups, but why is it only the four of us getting this explanation? I thought you’d explain things after our entire group was gathered together. If this is some scheme against us, or some kind of harassment, then I want you to knock it off.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa kept talking without pause, as if intending to be disagreeable to the very end. Mashima-sensei remained expressionless.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It would appear that you cannot help but be concerned by this small gathering. Therefore, I will try to provide an answer. This is neither a conspiracy against the students, nor is it harassment. It’s rather simple. The groups don’t consist of members from just one class; they are made up of about three to five individuals collected from each class. If we didn’t explain things in advance, we would run the risk of confusion.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was why only a few people were gathered into each room. The other three still didn’t seem to understand. They fell silent again, as if they were going over what Mashima-sensei had said in their heads. Of course, I couldn’t immediately digest it, either. We were so quiet that we could hear the clock ticking.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait a minute. What do you mean? I still don’t get it at all. We’re going to be grouped with students from other classes? Isn’t that crazy, though? Aren’t the other classes supposed to be the enemy?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s right, Sensei. We’ve been competing against the other classes up until now. Now we’re supposed to ignore all of that and just suddenly team up with them?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI understood Karuizawa and Yukimura’s point, but the school decided the rules.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’ve been competing until now? Your school lives have only just begun. You shouldn’t run around like a chicken with its head cut off this early, Yukimura.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I… P-pardon me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Right now, you shouldn’t spend your energy on trying to understand this test. Rather, focus on how to think. Your group assignment is ‘Rabbit’. Here is a list of the members. You will be required to return this list when you leave the room. If you feel it’s necessary, I would recommend trying to memorize it now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe passed over a postcard-sized piece of paper. On it were listed fourteen names of people in our group. As Mashima-sensei had told us, apart from us four, all the others were from Classes A, B, and C. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Mashima-sensei had said we were in the Rabbit group, the group name was written in Japanese, placed in parentheses next to the Chinese reading. That made it easier to read, and thus easier to distinguish who was in our group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCLASS A:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Takemoto Shigeru, Machida Kouji, Morishige Takurou\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCLASS B:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ichinose Honami, Hamaguchi Tetsuya, Beppu Ryouta\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCLASS C:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ibuki Mio, Manabe Shiho, Yabu Nanami, Yamashita Saki\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 0.80em;\"\u003eCLASS D:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Ayanokouji Kiyotaka, Karuizawa Kei, Sotomura Hideo, Yukimura Teruhiko\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI know some of the students on the list. Ichinose from Class B; Ibuki from Class C. Apparently, we were teammates now. At this point, I couldn’t really imagine what this exam was going to be. Was it even possible for us to compete alongside other classes, like Karuizawa and Yukimura had said? I quickly glanced out the corner of my eye at Karuizawa. She looked a little perplexed. Being placed into the same group as Ibuki was a perverse kind of fate.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t worry. I will answer any questions you have. I\u0026#160;believe you will be able to understand everything afterward. Probably.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe tacked on the “probably” because he likely doubted that Karuizawa was going to listen. Understandable. Mashima-sensei then explained this baffling group’s formation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The point of this test is to ignore the prior fraught relationships between Classes A through D. If you do, you’ll have a shortcut.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ignore the fraught relationships? What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa, please. I’m begging you, shut up and listen. I can’t concentrate when you prattle on,” Yukimura begged, completely exasperated.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“From this point on, you are no longer acting as members of Class D, but rather as members of the Rabbit group. Whether you pass or fail this test depends on each group.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was understanding more and more, little by little, but still couldn’t see the bigger picture.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There are four possible outcomes that can be achieved in this special test. No exceptions. We have also prepared handouts with the grade items so that you may better understand them. However, you are prohibited from taking these handouts, taking photographs of them, or anything or the sort. You should verify the contents here and now.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome slightly crumpled-up sheets of paper had been prepared for the four of us. Most likely, the students who were here before us had already looked at them. The basic rules were written as follows:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em; text-transform: uppercase;\"\u003eAN EXPLANATION OF THE SUMMER GROUP\u003cbr/\u003eSPECIAL EXAMINATION\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThis assignment centers on a “VIP” assigned to each group. By providing answers to the school via a defined method, you will earn one of four outcomes.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAt 8:00 a.m. on the first day of the test, each student will simultaneously receive a message informing you that we have chosen someone to be the “VIP” in your group. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThe test begins tomorrow and ends at 9:00 p.m. on the fourth day. (You are completely free to do as you wish for the first day.)\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eEach group should gather twice during the day at a predetermined time in a predetermined room to talk for one hour, so that they may discuss matters with only their group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThe contents of each group’s discussion shall be left to the discretion of the group itself.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAfter the test has concluded, the school will only accept answers during the period between 9:30 p.m. and 10:00 p.m. on that final night. During that time, each group must submit their answer regarding who they think the “VIP” is. Each individual may only submit an answer once, but only the first answer received from any member of a group will decide the test result for that group. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eAnswers must be sent only to an email address that we shall provide to each group, and only by using your mobile devices.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThe twelve VIPs cannot submit answers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYou may only submit an answer for the group to which you are assigned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eTest results will be sent to all students via email at 11:00 p.m. on the final day.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA list of fundamental rules was written on the paper. More detailed descriptions of the rules and a list of prohibited items were also on the sheet, among other things. The terms were stricter than the rules for the test on the uninhabited island, with many more precautions. After the rules, I saw the four potential “outcomes”:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em; text-transform: uppercase;\"\u003eOUTCOME #1:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf the\u0026#160;answer submitted by the group after 9:30 p.m. on the final day is correct, then everyone in the group will receive private points, including those of the VIP’s classmates who belong to the group.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em; text-transform: uppercase;\"\u003eOUTCOME #2:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e\u0026#160;\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIf a group fails to submit an answer between 9:30\u0026#160;p.m. and 10 p.m. on the final day, or if someone from the group other than the VIP and their classmates submits an incorrect answer, then the VIP will be awarded 500,000 private points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThese seemed like rather eccentric rules. Since we hadn’t received any deeper explanation, the mechanisms of the test seemed unclear. The Professor and Karuizawa cocked their heads over and over, as if wracking their brains. Mashima-sensei, seeing their\u0026#160;reaction, gave us a supplementary explanation in his flat, unchanging tone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This exam has one critical element. Understand it, and this test will not pose a problem. The key element is the existence of the VIP. There is only one VIP in the group. In this test, you’re after the name of the VIP. It’s that simple. For example, Yukimura, let’s say that you were chosen as VIP. The correct answer for the Rabbit group would be ‘Yukimura.’ That answer would be shared with all members of your group. Then, after the test concludes at 9:00 p.m. at the end of the third day, the school would accept answer submissions only between 9:30 p.m. and 10:00 p.m. During that time, each member of your group should enter the name ‘Yukimura’ in a message and email it to the school. Your group would pass, and we would confirm that you’ve met Outcome #1, and thus every member of your group would be awarded 500,000 points. In addition, as a reward for leading their group to achieving Outcome #1, the VIP would receive double that amount—1,000,000 points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O-one million?! Whoa.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, everyone receives 500,000 points? And if you’re the VIP, you get \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edouble\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was such a heinous amount of points to receive that anyone, regardless of their regular class, would want it. Also, since the VIP would receive twice that amount, he or she would become so wealthy that they would jump straight to the top of the class, regardless of grade. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Now then, as for Outcome #2… In the event that the VIP’s identity is not discovered before the end of the examination, and no one in your group found out the identity of the VIP or some even attempted to \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003elie \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eabout the identity, then only the VIP will be awarded points, just as it says. He or she will receive 500,000 points.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWait, was this even a valid test? Outcomes #1 and #2 were largely the same. In either case, the VIP would receive a large amount of points. There was no benefit to Outcome #2, unless you wanted to prevent other classes from getting points. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez, everyone’s gonna be jealous of the VIP! Not being picked for it would be unfair! No matter what happens, that person still gets points! And if we get Outcome #1, it’s a million points!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa seemed like she wanted to be chosen as the VIP. That was natural, though. The VIP received special treatment. Was that the advantage of being the VIP? However, so far we’d heard only two of four outcomes. There might yet be some tricks that hadn’t been revealed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sensei, what about Outcomes #3 and #4? We don’t understand the conditions for those yet.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you understand the explanation for the first two? If you do not, then we cannot continue.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course, we understand. Please continue.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter a short pause, Mashima-sensei went on.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Regarding the remaining outcomes, they are written on the reverse side of the handout. However, please wait a bit before turning the paper over.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe had instinctively reached over to flip the paper, but stopped once we heard that. As we began to grasp the rules of this exam little by little, Mashima-sensei stared at us with sharp eyes. It seemed like the exam had already begun.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, wait a minute. I’m not following you at all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough Mashima-sensei had given us a rather simple explanation, Karuizawa had only been half-listening, so she didn’t completely understand. Her problem wasn’t that she scored poorly on tests like Sudou or Ike. Since she refused to listen, her comprehension was abnormally bad.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Very well, I will explain in simpler terms. Have you played the game \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWerewolf?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWerewolf?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Oh, that game’s been popular for a while, right? Yeah, yeah, I’ve played it. It’s pretty interesting,” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI couldn’t help but be slightly bewildered, and my reaction showed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait a second. Ayanokouji-kun, don’t tell me you don’t know about \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWerewolf?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e Whoa, I can’t believe it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe could be amazed all she wanted, but I hadn’t heard of it. Besides, it was probably a lot more fun playing games with friends than playing by yourself. That happy state was way beyond my reach, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa seemed to realize this, and appeared sad. “I’m sorry. It’s just, like, not having friends must be so sad.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe crossed her arms and began to explain the game.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, you get together with your friends, and then you divide people up as either villagers or wolves. The one who survives at the end is the winner. Get it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo, I didn’t get it at all!\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo, what, I could be king of the wolves or something? Mashima-sensei, unable to leave it at that, began to explain the details of the game a little more thoroughly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWerewolf\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was invented by an American as a sort of party game. There is no limit on the number of players you can have, but you need the minimum in order to play. There are several roles that players can adopt, including “villager” and “wolf.” There seemed to be various other roles, but the important thing was whether the villagers or wolves survived. The wolves were supposedly dressed up like people and pretending to be villagers.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe game has two time periods. During the day, everyone gets together and talks, including the wolves that are pretending to be villagers. The players who are suspected of being wolves are executed. When nighttime falls, the wolves prey upon one villager. Those phases repeat, and the number of players continues to fall. Then, when enough players have been taken out, it’s decided which side was victorious and which was defeated. That was the simple breakdown.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, why was it necessary to use this \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWerewolf\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e game as an example? If we considered the rules that we’d received thus far, then the wolves and people should just cooperate and aim for Outcome #1. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Although I said that there is only one VIP in the group, if the VIP is exposed right away, then Outcomes #3 and #4 will appear.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And that’s…on the other side of the handout, right? Is it okay if we turn it over?” Karuizawa asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei nodded. We flipped the paper over. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe remaining two outcomes were written on it. For those two outcomes alone, answers would be accepted at any time during the test, or during the 30 minutes after the test had ended, just like with the other rules. Should you make a mistake in either timeframe, you would incur a penalty.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em; text-transform: uppercase;\"\u003eOUTCOME #3:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThis outcome is triggered when someone other than the VIP gives the correct answer to the school without waiting until 9:30 p.m. on the final day of the exam. That student’s class will gain fifty class points, and the person who submitted the correct answer will earn 500,000 private points. Also, the VIP’s class will lose fifty class points as a penalty. At that point, the group’s testing period will come to an end. However, if one of the VIP’s classmates is the person who submits the correct answer, this answer will not be counted and the test will continue.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 1.00em; text-transform: uppercase;\"\u003eOUTCOME #4:\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThis outcome is triggered when someone other than the VIP gives an incorrect answer without waiting until 9:30 p.m. on the final day of the exam. That student’s class will lose fifty class points. The VIP will earn 500,000 private points, and the VIP’s class will earn fifty class points. The testing period will end for the group that submitted the incorrect answer. However, if one of the VIP’s classmates is the person who submits the incorrect answer, this answer will not be counted and the test will continue.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe remaining two outcomes made it much easier to see the big picture. If we were limited to only Outcomes #1 and #2, there was no problem if the VIP shared their identity with everyone. Even if you made a mistake, there was no penalty. However, with the addition of these “traitor” rules, the test was suddenly flipped on its head. Should the VIP carelessly out themselves, traitors would prey upon them. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the school would accept answers any time during the test, no one would seriously aim for Outcome #1. Everyone would take actions that would garner points. If the VIP wanted to trick the other classes and secure their own victory, they could come up with a scheme to make it look like another person was the VIP. Your reward would be reduced, but you’d also be penalizing the other classes. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school will take anonymity into account during this test. At the end, only the outcomes for each group and the increase or decrease in points for each class will be announced. In other words, we will not announce the names of the VIPs or those who submitted answers. Also, if you wish, you may have a temporary ID assigned to you, to which you can transfer points. It is also possible to divide points up and receive them that way. If you yourself remain quiet, there should be no fear of discovery after the test. Of course, if it’s not necessary for you to hide your identity, you may receive your points openly. That is perfectly fine.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey’d been thorough; finding the VIP in this text was going to be extremely difficult. If you wanted to earn a lot of money just for yourself and didn’t tell your classmates the truth about the VIP, you could feed everyone a steady diet of lies. For instance, if Yukimura were the VIP, I could theoretically mislead the students from the other classes and make them believe that the Professor or Karuizawa was the VIP.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis test would become dramatically difficult if there were VIPs in our class. In such a case, you’d have to undergo rigorous probing and deceive others. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Outcomes #3 and #4 are very different from the first two. That’s why they are listed on the reverse side of the sheet. With that, the explanation is complete.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Umm, umm. I kind of get it, but I kind of don’t.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Heh, I must confess that I myself am somewhat confused.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You two are idiots. I’ll explain it later, so don’t keep bothering Mashima-sensei.” Yukimura, who seemed like he wanted to cozy up to school officials, shot Karuizawa down quickly. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded somewhat close to the Werewolf game, but only somewhat. True, the wolves had some advantages, but the villagers were also granted the power over life and death. They could shoot their targets dead. However, if the villagers were deceived, they might start to kill each other. I tried to simplify the rules in my head.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFirst, the testing period lasted three days. Compared to the test on the island, this was rather short. The school had divided up all first-year students in certain ways, and then made twelve groups based on the Zodiac. Each group contained a mixture of students from various classes, but within the group, you functioned as allies. Although the number of people varied slightly, each group had roughly fourteen people. In each group, one student was assigned the “VIP” role.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe VIP was free to tell others, “I’m the VIP, my name is the answer.” In such a case, winning was a sure thing. Of course, the test was structured in such a way that the if the VIP \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eweren’t\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e discovered, the rest of the students couldn’t answer correctly. Of course, it was possible to take a shot in the dark and guess correctly after narrowing down the list, but the penalties for guessing incorrectly were huge. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ePunishments here carried the same level of severity as on the island. I tried to neatly summarize tangible methods for clearing the test.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe VIP shares his or her identity with the entire group, and we all clear the exam.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomeone else tries to answer at the end, but they incorrectly guess the name of our VIP. We win.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe traitor finds the VIP.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe traitor is misled about the VIP’s identity.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFour possibilities. Unfortunately, each of the four results yielded vastly different amounts of points. The first option, “The VIP shares his or her identity with the entire group, and we all clear the exam,” required that we wait for the test to end, and then have everyone submit the correct answer. In that case, the reward would be incredible. The VIP would earn one million points, and everyone else would earn 500,000 points. But it would be highly difficult to get such an outcome.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSome groups might have an advantage due to the varying number of people on each team. It was highly possible that someone might betray the others if they knew the answer. Most people would want to earn a reward, and would betray others before they themselves were betrayed. Real harmony would be difficult to come\u0026#160;by.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eRegarding the next option: “Someone else tries to answer at the end, but they incorrectly guess the name of our VIP.” That would happen if we failed to discover the VIP’s identity even after searching within our group. This might very well happen. Many students didn’t like taking risks, and if they weren’t sure of the answer, they’d become a traitor. It’d be difficult for everyone to answer correctly, and easy for the VIP to conceal themself. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf the VIP remained quiet, people probably wouldn’t discover their identity. On top of that, they’d earn 500,000 private points as a reward. Being the VIP was like having a ticket to happiness. However, there were some unseen disadvantages. Due to the test’s format, there would probably be many discussions and exchanges within the group. You’d have to come up with lies on the spot. Even though anonymity was ideal, it largely depended on what you could and couldn’t do. Your class and the other classes might grow to resent you.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe third option: “The traitor finds the VIP.” In that case, a student learns the VIP’s identity. They either submit their answer right away, or send the school an email after the test ends with the correct answer. Incredibly, in this case the test could end immediately after it begins. The traitor would earn fifty class points and determine which classes would end up on top. In addition, the individual traitor would earn 500,000 private points.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis meant that someone could deceive another class and contribute to their own. For everyone, this would be an ideal result. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFinally, the last option: “The traitor is misled about the VIP’s identity.” This option had the biggest downside. If you were mistaken and guessed incorrectly, the person who submitted the incorrect answer would be slapped with a penalty, causing his or her class to lose fifty points. On top of that, the VIP would receive private points, and his or her class would receive class points. I wanted to avoid that outcome most of all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis test was about thinking. The school said this required cognitive abilities, which seemed true. This test carried dangers far different from those we’d faced on the island. There were twelve groups, with twelve outcomes. In the worst-case scenario, we’d end up with a huge difference in points from which we couldn’t recover. On the flip side, it was also possible for Class D to overtake Class A in one go. Of course, such a thing wouldn’t happen easily any time soon, but just the possibility was amazing. That’s exactly why the school’s rules here were stricter than during the test on the island.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There should also be a list of prohibited actions on the sheet. Make sure to examine it thoroughly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eListed were things like stealing another person’s cell phone; using threats to confirm information related to the VIP; using someone else’s cell phone without their permission to submit answers; and so on. The highest level of punishment for these actions was expulsion. Furthermore, if any suspicious activity were discovered, the school would open up a thorough investigation to make sure no one had broken any rules.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf someone lied about using threatening force, they could be expelled. It seemed like we were being monitored heavily, so it was best to keep that in mind. Also, the sheet said that discussion among students from other classes was forbidden until after the examination ended. If you broke that rule, you’d be expelled. I easily memorized the list of rules.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Tomorrow, you will go to your designated room at 1:00 p.m. and again at 8:00 p.m. Your group’s name will be displayed on a nameplate outside. Be sure to introduce yourselves when you meet the other members for the first time. After you’ve entered, leaving the room during the examination is not permitted. Please use the restroom ahead of time. In the event that you feel ill or can’t endure it any longer, please contact your homeroom teacher immediately and make a request.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wait, we can’t leave the room? How long do we need to stay in there?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The explanation is written on the sheet. The discussion period is for one hour. Aside from self-introduction upon your initial meeting, you are free to use that time however you like. Once the hour has passed, you are free to remain in the room or to leave.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo the students dictated the meeting’s events?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Agh. Well, this sounds kinda annoying, but I guess I do understand somewhat. Ugh. I just wish we had a test that was more fun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The school is committed to fairness, so we will be strict and impartial. After the VIP has been selected, we will not accept any changes, not even if the VIP wants to be changed. In addition, copying, deleting, transferring, or modifying emails sent from the school is prohibited. Understand these points clearly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat was written about in detail on the list. We were decidedly not allowed to tamper with emails sent by the school, or use them to spread misinformation. On the flip side, that meant that any message sent from the school was 100% the truth. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hey, Ayanokouji. You’ve been quiet. Do you actually understand everything?” said Yukimura, seated on my left. It was unclear whether he was angry or concerned.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For the most part, I guess. I’d like you to explain the things I don’t fully understand later, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“For crying out loud, why on \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eearth\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was I lumped in with a bunch of space cadets?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter that, the meeting was over, and we were told to leave the room. I felt discontent from my neighbors, who seemed to be harboring unpleasant feelings. I pretended not to notice. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I hate to say this, but if we have to be in the same group, we need to put up a unified front. A lot of things will depend on who the VIP is, but for now, the four of us should discuss things.” Yukimura spoke as we left Mashima-sensei and walked down the hallway. However, Karuizawa showed no concern at all for the future. Ignoring us, she took out her cell phone and walked away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“H-hey, Karuizawa. Are you listening?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa, totally unconcerned, started to make a call. I was kind of impressed. It was like she had nerves of steel.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, hi, Hirata-kun? There was something I wanted to talk to you about.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe was probably going to complain to Hirata. She quickly strode down the hall and disappeared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Why on \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eearth\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e was I lumped in with a bunch of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003espace cadets\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho, you uttered that exact same expression word for word not five minutes earlier, did you not? Hah!” the\u0026#160;Professor chortled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOur vacation had come to an end, and round two had just begun. Well, I’d expected this. Feeling depressed by this whole situation, I decided to return to my room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This has turned into quite a bothersome ordeal. Being partnered with a bitch like that, I mean,” spat the Professor after Karuizawa disappeared from view.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe Professor often said he wanted to go to the 2D world, and that 2D women were perfect. Knowing that, I understood why he’d strongly reject real girls like Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“To be honest, I really hate it. No matter what I do, she’ll only drag us down.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That is certainly true, hmm? She’s an unforgivable bitch. She’s a bitch among bitches, wouldn’t you say?” replied the Professor, as if agreeing with Yukimura. He exhaled loudly out of his nose and patted his belly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Maybe in the morning there’ll be a notification that one of us was chosen as the VIP. If one of us \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003echosen, it’d be smart not to spread it around carelessly. We don’t know who might be listening. Let’s get to a secure location before sharing info.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI agreed with that plan. Although the ship was rather spacious, people might be listening in unexpected places.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa may be gone, but I want to talk about tomorrow. It makes sense to discuss it with just the three of us. Let’s go.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I am terribly sorry, but I must decline your invitation. For you see, the Love Love Alive anime calls, and I cannot afford to miss its siren song. I bid you farewell. Hi-ya!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe vanished like a ninja. Well, not really—the Professor was well visible as he walked away. Yukimura, with only me remaining, sighed as if he were giving up and shook his head. He didn’t seem to want to work with me. Guess we weren’t going to have a discussion.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI supposed I should report to Horikita. I wanted to know if she’d received the same information as the Rabbit group. I sent details to her in chat, and while I waited on her report, I started to come up with a strategy.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.4\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e returned to my room, dying for a moment of peace and quiet. In the middle of dozing, I thought I heard a noise, and propped myself up in bed. Neither Yukimura nor Kouenji were in the room.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m sorry. Did I wake you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata, who’d been putting his luggage back in order, looked up with a slightly apologetic expression. He was putting on his uniform, which made me think he was getting ready to leave.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Nah, I wasn’t really in a deep sleep or anything. I’m pretty thirsty anyway, so it’s a good time to get up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI went ahead and shut off the alarm that had been about to go off. I’d wanted to check on Horikita anyway, so there wasn’t a problem. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Would you like to come with me? I was thinking the school’s message should be coming pretty soon.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was just before 20:30, then. Whether due to coincidence or fate, that just happened to be the time Horikita had been summoned to her meeting. I had no reason to refuse, so Hirata and I stepped out into the hallway, with me still wearing my jersey.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The test seems really unusual. Well, that’s just a feeling I have.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt seemed like Hirata already knew the test’s specifics. I wondered if he’d heard about it from another student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I heard it from Yukimura-kun. He told me about it while we were eating. He told me all about the Rabbit group. It seems like everyone has been receiving explanations of the test. Several people have come to talk to me about it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura didn’t exactly like Hirata much, but maybe he thought telling Hirata would improve our chances of winning. If you understood the rules beforehand, it would be easier to glean more information when you were listening to the official explanation. Yukimura might have told Hirata in order to hear what Hirata thought afterward, and to see if there was anything new to think about. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOf course, that was surprisingly bold. I’d have liked to follow his example and team up with a superior student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you notice anything, Ayanokouji-kun? If it’s okay, I’d like you to share it with me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can’t really say. I haven’t been thinking about the exam like you, Horikita, and Yukimura have. I’m not smart, either, so I haven’t really noticed much.” I tilted my head to the side, as if nothing sprang to mind. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wasn’t going to tell Hirata anything more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I was wondering why the explanations are so…scattered. I thought maybe the school wanted to avoid the confusion and trouble that would come from explaining things in one large group, but after thinking about it, I don’t believe it would take much more effort to announce the rules to everyone at once.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, I think you’re right, Hirata. It would definitely be more efficient to explain the test to all the students at the same time, rather than dividing us into groups and doing it in stages.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata’s doubts were right on the money. The school had adopted a clearly inefficient method. Perhaps we should consider why they would split us up, and for what reason. It was possible that our “thinking” was already being tested.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m planning to ask the teacher about that later.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI wondered how things would shake out. Hirata normally acted on behalf of Class D. Considering he’d be lumped in with other classes, I couldn’t imagine what he thought of these rules, or what he’d do about them.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.5\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eH\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eirata’s meeting place was on the second deck, only one level below us. We took the stairs instead of the elevator. I saw quite a few students waiting around compared to earlier. Some of the students were leaning against the wall. Others were sitting down, fiddling around on their phones. They looked totally unprepared for the explanation they were about to receive. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It doesn’t seem like all of these people are in my group,” Hirata said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt a glance, it looked like there were close to ten people here. Considering the time, even if some part of the group had already been briefed, it did seem rather strange. Did this meeting have some other purpose? Were they all checking to see who belonged to which group? If so, they didn’t need to spend all this time and effort. If you just talked to your classmates later, you could figure out the groups right away. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThey glanced up as we passed, but then immediately went back to their cell phones, like they were in the middle of something. Sadly, I knew very little about the students from the other classes. I wasn’t acquainted with most people I’d run into here, and I didn’t know which classes they were all from.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Who are those people?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s Morimiya-kun, from Class A. And that one near the elevator is Tokitou-kun, from Class C.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust how I’d expect a well-connected person to respond. I burned the names and faces of the students into my memory. It was a surprising number of people. Maybe they’d felt restless, and arrived early to wait. You know, like trying to get a table at a popular restaurant. I kept moving, thinking how easy this would all be if it operated like that. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWhen Hirata and I arrived, several guys and girls were gathered near the door. I also noticed a familiar face who’d received the same meeting time as Hirata. The meeting hadn’t started yet, so we approached the line without making a fuss.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unless I’m mistaken, you’re also in the group meeting at 20:40, yes?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI heard a rather low, deep voice. Katsuragi, from Class A. He had an incredibly calm and collected demeanor for a first-year high school student. He was cool and composed, and had a good physique to boot. You could mistake him for a college student at first glance. Even though Class A boasted many excellent students, most had already acknowledged him as their leader.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I am. And what exactly does that have to do with you?” answered the girl with long black hair, who faced Katsuragi without hesitation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I knew it,” he said. “That’s good news. I wanted to speak with you again. I’m also in the 20:40 group. Starting tomorrow, we will be working together.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita Suzune stared back at Katsuragi. So Hirata had been placed with both Horikita and Katsuragi. Quite a team.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You wanted to speak with me? Funny. Didn’t you completely ignore me the other day?” she said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDuring the test on the island, Horikita and Katsuragi had crossed paths only once. At the time, Katsuragi showed no interest in Horikita and hadn’t tried to hold a conversation with her. However, the tables had apparently turned. Three guys who probably belonged to Class A grouped around Katsuragi, as well as two girls from either Class B or C. They listened in on the conversation from a short distance away.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re correct. I certainly haven’t acknowledged anyone in Class D until now. However, considering the incredible results from the last test, it would be impossible for me not to pay attention to you. Wouldn’t you agree? You laid the groundwork to win, and succeeded handsomely.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe probably never could have imagined that Class D would be triumphant. From Katsuragi’s point of view, his contact with Horikita in front of the cave had all been a part of her strategy. Horikita had certainly made big waves within Class D, and the number of girls who admired her had increased over the last few days. Unfortunately, Horikita didn’t exactly respond well to people who wanted to become friends with her. However, compared to how things had gone in the past, she’d hurt and enraged fewer people than usual. Her classmates now seemed to interpret her selfish demeanor as concern for the class.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that in mind, Horikita’s refusal to become anyone’s friend now came across differently. Interactions with her suddenly became more nuanced. Even if she gave them the cold shoulder, people didn’t really take offense. If anything, they might’ve found it cute. Other classes now viewed Horikita as more than a superior student with good grades. Because of the results she’d garnered, they viewed her as a puppet master, a mastermind who worked behind the scenes. They viewed her as a threat, and were on guard around her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t know what the future might hold, but…should Class D overtake Class C, know that Class A would attack you without mercy.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s rather petty. From Class A’s perspective, are we such a big deal? I mean, there’s a significant gap in points between us.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s certainly true. However, we must be cautious. It’s no laughing matter when those who have been perceived as weak and stupid begin to rise up. If one class manages to change its station, we must be vigilant. I\u0026#160;would give the same warning to both Classes B and C.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThere wasn’t much we could do about being seen as a threat, though. Katsuragi’s entourage collectively glared at Horikita. An ordinary girl would’ve burst into tears, but Horikita didn’t seem intimidated in the slightest. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe situation appeared hopeless, until an unexpected arrival changed everything. The girls’ faces instantly lit up as a boy walked quietly past us.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I don’t much like ganging up on people, or threatening other classes.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was Kanzaki, a Class B student. Though he wore his hair rather long, he didn’t come off like a slacker at all. He was an honest type. Although I didn’t really know him personally, Ichinose—Class B’s leader—seemed to trust him. Since Horikita and Kanzaki had faced off once before during our summer vacation, he knew of her incredible intellect.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t need to waste time on Katsuragi. He’s just trying to get to you.” Kanzaki spoke like a gentleman to Horikita, even though they weren’t on particularly good terms.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You needn’t concern yourself. Class D has always been regarded as inferior. I’d welcome any change in our reputation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I see. It appears you feel we’ve treated you callously up until now. Certainly, many in my class have made light of Class D. However, your success on the island changed people’s opinions.” Despite his words, Katsuragi made a dismissive gesture, like he was brushing dirt off his clothes. “However, just because you got lucky and won by complete chance doesn’t make us equals.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Anyone could accomplish something like that out of pure luck. It’s better that you don’t grow arrogant and behave foolishly after a win that came about by chance. Remember that the difference in our class points is still massive.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, that was true. Bridging the gap between us would still be difficult. Of course, Horikita understood that. She also knew that the island was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003emy\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e victory, but I’d refused to take credit for anything. Right now, Horikita didn’t seem too happy to take the credit; she didn’t love being in the spotlight. She’d mainly done it so other people wouldn’t discover me. Really, it was all for my benefit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We haven’t gotten into college yet. I don’t think you and I are so different. The school arbitrarily divided us into different classes. Don’t forget that.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKanzaki, who’d been standing by watching this scene unfold, saw where all this was headed. “Hirata, looks like you landed in a troublesome group.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. Though if I’m with you, Kanzaki-kun, and Katsuragi-kun, struggle has to be inevitable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, I don’t think so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSomeone came up behind me and walked over to Kanzaki, then proceeded toward Horikita. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, well. So many fish in this pond. I’ve come to take a look for myself.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ryuuen.” Katsuragi’s tone grew grim. Even Kanzaki stiffened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you part of this meeting as well? Or were you just walking by?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Unfortunately, it looks like I’m with you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThree students followed behind Ryuuen. It was like Katsuragi’s entourage, but also completely different, more like a king and his servants. They all wore terrified looks, and their movements seemed so docile.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“How about you put on a little show for me? What do you think of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eBeauty and the Beast\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?” said Ryuuen. He looked at both Horikita and Katsuragi, and let out a demented little chuckle.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn the face of this obvious provocation, Katsuragi stayed calm. “Well, I originally thought that our group would be comprised solely of students with a high level of academic ability. Now that you and your lackeys are here, I’m not so sure.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Academic ability? How droll. That kind of thing is meaningless.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s a rather deplorable thing to say. Especially when academic success is the most important factor in determining our futures. You realize that Japan is often referred to as an academic society?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKatsuragi struck back against Ryuuen’s cavalier attitude with a sound argument. However, Ryuuen wasn’t so easily convinced. He gestured to his crew, almost as if to ask, “Can you believe what this idiot is saying?” His minions agreed immediately, their response mechanical.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I won’t let you bring your awful attitude to this test.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? Awful attitude? What in the world are you talking about? I can’t possibly imagine. Can you perhaps tell me how I am, in fact, awful?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, it doesn’t matter. Since we’re in the same group now, we’ll be able to talk at length.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor a minute there, I thought there’d be a huge showdown before the test had even begun.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_TEXTBODY_CENTERALIGN_PAGEBREAK\"\u003e\u003cspan\u003e\u003cimg alt=\"\" height=\"100%\" id=\"ClassroomElite-Vol4_INTERIORILLUSTRATIONS_2\" src=\"/hola-lector-agua/images/books/v4/OEBPS/Images/ClassroomElite-Vol4_INTERIORILLUSTRATIONS_2.jpg\" loading=\"lazy\" decoding=\"async\" style=\" top: 0px; vertical-align: top; height: 100%;\"/\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P_Prose_Formatting__And__Page_Break\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh, Hirata-kun? Oh, Ayanokouji-kun, too? What are you all doing here?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida approached us, wearing a puzzled look. Apparently not everyone in Class D fully understood the parameters of the exam. Our class seemed to be one or two steps behind.\u003c/
