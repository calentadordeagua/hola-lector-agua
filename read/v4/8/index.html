"$\",\"script\",\"script-1\",{\"src\":\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"async\":true}]]],false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Ld\",null,{\"children\":\"$Le\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$9\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L10\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}],false]],\"m\":\"$undefined\",\"G\":[\"$11\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"12:I[15978,[\"/hola-lector-agua/_next/static/chunks/59dcd84a1352a67c.js\",\"/hola-lector-agua/_next/static/chunks/d548d1e4b2255406.js\",\"/hola-lector-agua/_next/static/chunks/2aeac92579e59d89.js\",\"/hola-lector-agua/_next/static/chunks/618cc3a09d79e3e5.js\",\"/hola-lector-agua/_next/static/chunks/799f0051eeffaa6b.js\"],\"HtmlReader\"]\n13:T221ab,"])</script><script>self.__next_f.push([1,"\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break\" id=\"auto_bookmark_toc_top\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003eChapter 2:\u003cbr/\u003eThe Gentle Days…\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003et’d been three days since the end of that special test on the island. No other exciting events had occurred aboard the luxurious cruise ship that the Advanced Nurturing High School had provided for us, and we were enjoying the respite. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt went without saying that time spent on a deserted island had caused a bunch of young, rambunctious students like us to lose our minds. We, the guys, were basically beasts—sex-starved carnivores. While we watched the girls chattering and dilly-dallying like herbivores, the boys waited for an opening like the predators that we are. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis luxurious cruise ship, equipped with everything, felt like a dream come true. This trip let us forget everything unpleasant. It wouldn’t have been strange to fall in love here. Rumor had it that many couples had come together on this trip. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUnfortunately, that wouldn’t happen to me. I lived a mostly solitary life. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe test hadn’t changed my situation… No, that wasn’t quite true. My environment had begun to change. Against my will, I’d been tasked with a major course correction. I’d originally come to this school for a certain reason. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Contact with anyone outside is forbidden until graduation.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat rule was the reason I entered. However, a certain man had been forcibly trying to establish contact with me. Chabashira-sensei, my homeroom teacher, told me that. Then Chabashira-sensei threatened to expel me from this paradise should I refuse to work toward Class A. Although I’d done nothing scandalous, a powerless creature like me had no choice but to accept. I didn’t know whether she was lying or not. Therefore, I had to assume it was the truth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHowever, I didn’t intend to dance to my homeroom teacher’s tune forever. While I collected the necessary information, I considered that I might need to take action. A little devil perched on my shoulder whispered softly in my ear: \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eIt’s better to get them before they get you.\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I wondered about the many ways I could force her to resign. Hmm.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThat troubling thought lasted only a second, though. My mind returned to its normal, blank way of thinking. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eSigh\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. If only I had the power to rotate the earth on its axis myself…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I could do that, I’d be able to live freely, without having to worry about the small things. I looked out the window and daydreamed about \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDragon Ball\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Three days had passed since the end of the test. Immediately after our survival test’s conclusion, most of the students had been waiting for the other shoe to drop. They’d treaded lightly in case the school was up to something. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBut there were no signs of anything malicious. All was gentle and peaceful, as if summer vacation had truly started and this was now an actual fun, pleasant trip. The students began to relax, and behaved as if the test really were over. They thought this second week was purely a vacation. Everyone became increasingly lax. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eDespite our outward calm, we maintained a sense of readiness. People who know how to relax can be effective.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Hmm? You haven’t been in the room all this time, have you?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata Yousuke, one of my cabin roommates, shook me from my reverie while I gazed at the sea. “I don’t really have any reason to go out. I don’t have anyone to hang out with, either.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s not true, though. I mean, you have Sudou-kun and the guys, and Horikita-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was certainly true that such people had categorized me as a “friend,” and I reciprocated. But those at the bottom strata of the “friends” category are treated differently from other, higher-ranked friends. When someone wants to hang out, low-level friends are only invited ten percent of the time. Naturally, I was that lowly friend.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You might make more friends if you were a little more proactive, Ayanokouji-kun. Though I suppose it’s none of my business.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata was very popular and admired by many students. All the girls adored him, and he had a girlfriend named Karuizawa. A man with so much happiness probably couldn’t understand the pangs of loneliness. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re a solid guy, Ayanokouji-kun. I think you might just need the right opportunity.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t need such kind-hearted yet cruel words. I didn’t need to hear girls say things like, “Oh, but I’ve heard you’re great,” because if I responded with, “Well then, let’s go out,” they would reply, “Well, I don’t know about that…” I didn’t need that. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI spend time by myself because I can’t make friends or get a girlfriend. You freaking\u0026#160;idiot.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m planning to meet up with Karuizawa-san and the others at 12:30 to have lunch. Do you want to come with? I think it’ll be really fun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Karuizawa and others?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. There are about three other girls. Want to come?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI had to think about that. To be perfectly honest, I’d wanted to interact with Karuizawa for a while now. However, there wasn’t any need to hurry. Besides, if there were other girls, forget about being able to even initiate conversation. I couldn’t imagine I’d be able to liven things up. In fact, I’d probably have a dampening effect.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ll pass. I don’t think I’m on especially good terms with Karuizawa’s group.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince the end of the first semester, the relationships in our class had been firmly established. How would I go about building friendships with other people at this point? I could already picture Karuizawa and the other girls’ disgust. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though he didn’t fully understand my fear of other people, Hirata sat next to me. “I can understand that you’re feeling hesitant. That’s exactly why I want you to rely on me.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata wore that eternal, optimistic smile of his. While it was a welcome offer, I shook my head. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You only have about ten minutes before you have to meet them. It’d be better if you just left me here.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need to hurry. Besides, I like spending time with you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTo an outsider, my words might have sounded like an excuse, but I was honestly satisfied with the current situation. Back when I had just started school, I’d wanted to make friends. I’d wanted to be able to make a hundred friends, but naturally, everyone settled down into their own separate factions. It was only a matter of course.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eEven though I’d only been able to talk with the three idiots Horikita, Kushida, and Sakura, my school life wasn’t all that bad. I really believed that. But Hirata wasn’t the type to leave someone be if he saw they were alone.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, how about just the two of us have lunch together, you and me? Would that be okay?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust the two of us alone. Sitting on the bed together. Hirata turned to me with a serious look. If he lightly pushed me down, things would get out of hand. “Well, I don’t particularly dislike the idea, but… Didn’t you already promise Karuizawa?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can eat with Karuizawa-san and the others any time, but I haven’t really had many opportunities to eat together with you, Ayanokouji-kun.” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNormally, a guy would do anything to get the chance to eat a meal with a girl. Typical male thinking. However, Hirata seemed able to prioritize eating with another guy without hesitation. It was enough to give me doubts. Perhaps he swung “that way.” Hirata was an effortless multitasker, but he never did anything without reason. “I’d feel bad if Karuizawa blamed you later, though.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI tried to gently turn him down, but it seemed to appeal to his conscience. I wondered if Hirata considered me a trembling newborn fawn that couldn’t even take its first step. “Don’t worry. I don’t think Karuizawa-san’s the kind of girl to hold a grudge.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo, no. Karuizawa \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edefinitely\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e seemed like that kind of girl. Even though she pretended to be nice in front of Hirata, she was domineering with other ladies. I wondered if Hirata had categorized her as not being “that type of girl.” It reminded me of that teacher from \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYomawari Sensei\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e, who showed mercy to bad students.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Okay. I’ll turn Karuizawa-san down for today.” Hirata pulled out his phone to call Karuizawa. I tried to stop him, but Hirata shot me a look. “Is there anything you’d like to eat?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I can eat just about anything, I guess. Though I’d like to avoid heavy food if possible,” I muttered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe cruise ship had many restaurants. The offerings ranged from junk food like ramen and hamburgers to French cuisine. Since it was still daytime, I wanted to eat something light if possible. I heard Hirata flatly tell Karuizawa that he was cancelling their plans over the phone. I couldn’t hear Karuizawa’s voice clearly, but Hirata abruptly hung up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are you really okay with this?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Of course. Well then, shall we go to the deck? If we’re just having a light meal, eating there should be easier.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata opened the door, as if to guide me, while I relaxed in bed. Hirata was being his usual concerned self, but taking me out when I wasn’t really that enthusiastic was odd. It seemed kind of forceful for Hirata, especially since he could normally read any situation well. He likely had some kind of ulterior motive.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Thank you for helping on the deserted island. I’m sorry I didn’t thank you enough for helping to find the culprit, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You don’t need to apologize. I wasn’t even useful. Horikita found the underwear thief.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Even so, I’m grateful to you for helping.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSpeaking of the underwear incident, I had something I wanted to ask. I looked around to confirm we were alone, then broached the topic. “Did Karuizawa get her underwear back?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah. When she heard Ibuki-san was the culprit, things went smoothly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa had her underwear stolen on the island, and for a while there’d been an uproar. Because the underwear was in a guy’s bag, the relationship between the guys and girls of Class D had been in a precarious state. But Hirata put his quick thinking to use, and concealed the underwear. Because of this, things had cooled down. I was really glad. It had been an extremely delicate operation, so I was impressed. I’d half-believed that Hirata would bungle returning the underwear, despite his skills.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata’s quiet and peaceful resolution to the underwear fiasco proved that he was steadily climbing the stairway to adulthood. We took the ship’s elevator to the deck on the top level. Many of our classmates appeared to be enjoying summer vacation to its fullest. Both guys and girls could be seen in the pool in their bathing suits, boldly frisking around. The heavy, fraught mood that weighed on us during the test had lifted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis display of wanton indulgence came from the students’ liberated desires, which had been suppressed back on the island. We didn’t need to use points for any of the facilities on the ship, or for food and drinks. Everything was free of charge. No one had to restrain themselves. You needed to borrow things like swimsuits and other equipment, but that was about it. It was heaven. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBy the time we reached the restaurant, over half of the seats had already been taken. We slipped past the crowd and secured two empty seats.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Honestly, there’s something I’d like your advice on.” Hirata spoke in a slightly apologetic way as he looked down at the menu. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Advice?” So he \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e have an ulterior motive, after all. That was probably why he’d wanted time to eat with me. Well, I was grateful. I didn’t sweat the reason for an invitation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not really the best person to come to for advice. Can you give me the short version?” I wasn’t exactly a great talker or listener, but he had likely selected me for a reason. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wondered if you would act as a bridge to help reach Horikita-san. After all, Class D will have to come together and work hard in the future, and I think Horikita-san will be indispensable.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo that’s what he wanted to talk to me about, huh? When I nodded, Hirata continued with confidence.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“The other day, Class D got a major boost thanks to Horikita-san. Class morale has shot up, and more than anything else, the number of people who idolize Horikita-san has increased. This is a big opportunity.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I suppose so.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHorikita Suzune was a student in Class D, and the first friend I’d made upon starting school. I was her first friend as well, but she was a solitary, standoffish person. She was an honors student, highly accomplished both in literary and martial arts. Her weakness was her aloof, independent personality. She didn’t involve herself with anyone due to her high-handed attitude, and she wasn’t very good at socializing. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s why I think she should try and get along with everyone right now. If she cooperated with us, I think we could get up to Class C, and then B… No, we could even reach Class A.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFrom anyone else it would have sounded phony, but Hirata had been singing Horikita’s praises since we started school. He’d been aware of her potential from the start, and didn’t seem to dislike her at all. I wouldn’t mind helping him out. The task was simple. I could at least bring Hirata and Horikita closer together, but that probably wouldn’t lead to a permanent solution.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But even if I can bring you both together, things won’t be that easy. Horikita is difficult.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf I asked her to soften her approach, she’d turn me down. If Horikita believed I was trying to manipulate her, things could end in disaster. She would distance herself even further. Her response to Kushida’s push for friendship in the café during our first semester was proof of that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes. I do understand, of course. Horikita-san only opens herself up to you, Ayanokouji-kun. I don’t want to force her confidence. That’s why I wanted to tell you my intentions, so that you can talk to her. Then, pretend I never spoke to you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSo I was supposed to be the Horikita whisperer, huh? I would be the go-between, delivering Hirata’s opinions to Horikita. If I did that, Horikita would enter into an unseen partnership with Hirata, and never realize it.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“If I thought she’d listen to me, things would be simple enough. But it won’t be that easy. I usually just go along with whatever Horikita says. I’ve never really forced my opinion on her. If I just suddenly start voicing strong opinions, she’ll probably find it suspicious. If she finds out it’s \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eyour\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e opinion, I think she’ll shut down completely.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But I can’t come up with anything else right now. I don’t think I have the confidence to speak with Horikita-san, let alone persuade her. This is my last resort.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Don’t you think it’s a little soon for last resorts?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata clearly wanted to join forces with Horikita, but he’d have to face her directly. I understood it was difficult, but so was coordinating groups of people. Horikita would probably agree. No one else in our class cherished friendship and community the way Hirata did. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was still uncertain about his proposal. It seemed like he’d lost his nerve and was doubting himself. Hirata had also been acting strangely back on the island. This wasn’t a trivial matter. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI ordered a light sandwich and a drink. Students swam in the pool nearby, and others were eating while still wearing their bathing suits. Everyone appeared to be having fun. If Ike and Yamauchi were here, they probably would’ve foregone the food and feasted their eyes on the girls instead. Hirata didn’t pay any attention to the girls at all, but focused squarely on me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yeah, you may be right. Like you said, Ayanokouji-kun. My plan was really short-sighted.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHe recognized his error in judgment and gave an honest, flexible response. Another of Hirata’s many charms. But his desire to work together with Horikita was so strong, he showed no signs of giving up.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I should probably reconsider how to do this. Horikita-san seems very fastidious and hypercritical. How do you manage to get along with her, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata wanted to become Horikita’s friend before establishing a working relationship. I thought facing her directly was the right thing to do. It was constructive, and I wanted to lend a hand, but…\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, in truth, I don’t think I’m on especially good terms with Horikita. Recently, I wondered if we could even be called friends.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But it does seem like Horikita-san gets along well with you alone, Ayanokouji-kun. You’re special to her.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSpecial, huh? Hard to believe that someone with over forty friends would say that to someone barely acquainted with one person. Or perhaps it was because he was able to get along with over forty people that Hirata felt frustrated at missing a connection with one particular student.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“There’s no need to get impatient, right? The first semester’s only just ended.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eBonds between people must fundamentally strengthen over time. Sometimes, you can place people together under sudden, harsh conditions, like the test on the island, and watch those bonds strengthen overnight. Of course, while you might see instant improvement via that method, those bonds can often be fragile. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Horikita isn’t the type to make friends easily.” I wanted Hirata to understand.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That’s probably true.” Hirata appeared slightly remorseful. Perhaps he felt like he was rushing things again. “I wasn’t thinking about her feelings. I was just thinking of myself.” Hirata shook himself from his reverie. Again, he smiled. “Sorry. I invited you out to eat and made it all about me. Well, let’s eat, shall we?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, we started eating our recently-arrived food. However, Hirata looked up and seemed to notice someone approaching us. He shot me a nonplussed look.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, so you’re here after all, Hirata-kun. Let’s eat lunch together!” Karuizawa approached us, leading a group of girls. She sounded happy and carefree.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Um… Karuizawa-san, I thought I canceled our plans…” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHirata stumbled over his words, looking unsure. Meanwhile, Karuizawa and the girls pulled out the chairs from another table, pushed me away, and circled Hirata. Our lunch went from peaceful to noisy in seconds flat. I wasn’t much of a talker, but I wasn’t really concerned. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI was used to dealing with situations like this. It was probably time for me to use the special skill I’d acquired since school began, my “Speedy Escape.” I grabbed my food and got up quietly, without making a sound. Hirata’s eyes met mine for a moment, but the girls closed ranks and he disappeared.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMaybe this was one of the select disadvantages of having so many friends. With so much time devoted to others, you didn’t really get any time for yourself. Even if Hirata had issues weighing him down, he couldn’t talk about them with Karuizawa and the others. Instead, he held them unspoken in his heart.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.1\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eA\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003efter Karuizawa\u003c/span\u003e\u003cspan style=\" font-size: 0.80em;\"\u003e \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003emonopolized Hirata, I decided to return to my room. I didn’t have anyone else to hang out with or talk to, anyway. I took the stairs rather than the elevator, and returned to my room on the third deck. When I got there, I noticed some wet blotches scattered about the hallway floor. The blotches appeared to head toward my room. When I followed the trail, I discovered an elegant man striding through the corridor, nude from the waist up, wearing nothing but a bathing suit.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“S-sir! Please don’t walk through the hallway while you’re still dripping wet!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA young bellhop hurried toward the man, apparently eager to control this emergency situation. The bellhop was already holding out a towel, overly prepared, like he always walked around with a strategic towel ready.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ha ha ha! It appears you’ve found me, eh?” the man\u0026#160;said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Yes, I’ve found you. This is the fourth time. I’ve already told you, please dry yourself off after you leave the pool. If you don’t, you’ll disturb the other passengers.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently, this man was a repeat offender. That explained the bellhop’s prepared towels. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Disturb? But I’ve no memory of disturbing anyone. I\u0026#160;don’t dry myself off with a towel on principle ever since reaching the age of reason. Haven’t I already said? ‘A fine man, dripping with water,’ hmm?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYes. The man was Kouenji. He slicked back his wet hair, scattering droplets of water. The bellhop hurriedly used the towel to dry the spots on the carpet and wall. Kouenji stopped. I wondered if he found the bellhop’s flustered behavior amusing.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you have a pen and paper on hand?” he asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? A, uh, oh…due to the nature of my job, I do walk around with a notepad and pen, but…” The bellhop, clearly unsure where the conversation was headed, fearfully took out a ballpoint pen. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Did you know that a prominent celebrity’s signature can accrue an unexpectedly premium value over time? Abroad, some autographs are valued in the millions to even the tens of millions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“And…what of it?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Kouenji finished scribbling something on the notepad, he thrust it back at the bellhop. It was far away, but I was able to make out the name “Kouenji Rokusuke.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wh-what is this?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Isn’t it obvious? A signature. Even though it’s written on such a cheap notepad, it will certainly hold tremendous value in the future. I’m presenting this to you as a token for your troubles. Please receive it gratefully and safeguard it.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently Kouenji believed the bellhop would receive this with gratitude, or perhaps a sense of awe-inspired devotion. But no one in their right mind would want this. If anything, his ballpoint pen and notepad were worth more.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Please don’t look so suspicious. I am the man who will carry Japan’s future on his back. At that point, I intend to vacation upon a larger ship, but I’m prepared to wait until then. Of course, it will be a luxury liner of significantly higher quality than the common ship upon which we are now riding.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWell, a luxury liner was still a luxury liner. Personally, I’d be satisfied as long as it wasn’t fated to sink like the \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eTitanic\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e. Kouenji guffawed, seemingly satisfied. The bellhop, completely dumbstruck, continued staring at the wet spots on the floor. He had completely lost the will to keep trying to stop this man. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji was alone all the time because our classmates steered clear of him, disgusted by his incredibly selfish personality. Many of our classmates had already experienced the same treatment as this poor bellhop. Hirata would probably try to speak with him, but he’d most likely be brushed off as well. Kouenji was like poison. Anyone who encountered him, friend or foe, suffered for\u0026#160;it. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIn order to avoid being dragged into something so bothersome, I slunk past the two of them. Getting too near a person of \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003esuch\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e high rank would be dangerous.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh ho? Why, if it isn’t little Ayanokouji, hmm? What a coincidence.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eUgh. Kouenji called my name. There was no way he was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eactually\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e calling me, right? The instant the bellhop noticed that Kouenji’s attention had shifted over to me, he appeared elated. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m finally free!\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e is what his look seemed to say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo, no. How could a crew member act like that? He ought to continue serving the customer, no matter how annoying the customer was. It was like someone releasing their pet into the river without permission. Especially if that fish was a ferocious, invasive species like Kouenji, which would devour all the native fish in the river until there was nothing left.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Do you want something from me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“No, no, I’ve no real business with you. I’ve simply acknowledged you because we are schoolmates. Also, though we are certainly not alike in terms of position, you are my roommate.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKouenji flipped his hair once again, scattering more water, which splashed my face and uniform. Of course, he didn’t seem to have the faintest clue what he was doing to his victims. Despite what was happening to me, the bellhop watched this tragedy unfold with a grin. \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eOh yes, yes, I sympathize with the pain you’re feeling…not, \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehe seemed to say.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I will excuse myself. Please do take care in the future.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe bellhop delivered that parting shot as he made his escape, having fulfilled the bare minimum for his role. Of course, I didn’t exactly want to end up alone with Kouenji, either.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What were you talking with Kouenji about?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eFor an instant, the bellhop’s expression changed to a look of anger, but when Kouenji turned around, the young man’s smile returned. He was like Asuraman or something.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, um. Well, as you can see, he was wet. I tried to offer him a towel, and—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, in other words, you were giving him a warning. I\u0026#160;must have interrupted you, so I’ll be on my way and let you get down to business.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI passed the ball, if you will, a blazing fastball that crushed the bellhop and gave me a chance to escape.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This bellhop came to give \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eme\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ewarning\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e?” Kouenji cried.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, no. Well, that is to say…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI managed to escape from Kouenji and headed back toward my room. “But I’ll just bump into Kouenji again there, won’t I?” I murmured.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy room would become less of a sanctuary and more of a hell. I’d been alone with Kouenji several times during our trip, and every experience was unbelievably uncomfortable. Wanting to avoid such an awkward atmosphere, I turned around. I wouldn’t return to my room just yet. I’d head back to where Hirata and Yukimura, my other roommates, would be. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eA map of the ship was on a nearby signboard, and pretty easy to understand. The fact that the map had been placed in a gilded frame might’ve been overkill, but also made it seem like something you’d find on a luxury liner. I drew a route that’d let me kill a bunch of free time, and immediately hopped onto the elevator. I got off on the second deck. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe ship had nine decks in total, plus a roof. The fifth deck was above ground, while the fourth deck was below. The first deck housed both the lounge and banquet area, while the rooftop had the pool, café, and other facilities. The third and fourth decks were for guest rooms. The guys were on the third deck; the girls on the fourth.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe guys and girls, teachers included, were neatly divided. However, there weren’t any special restrictions on our movements, so a guy could easily wander through the girls’ area. We were probably prohibited from staying on the girls’ level or coming into the area after midnight, though.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe ship also had various kinds of entertainment options, such as movies and a live theater venue. These were everywhere, from the first underground level up to the third underground level. On the fourth underground level—the lowest level at the bottom of the ship—was some kind of switchboard breaker room. That particular level was irrelevant to the students. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe lounge was open twenty-four hours a day. We were free to go there no matter how late it was, but a notice from the school urged us to refrain from going there as much as possible. As I walked through the second-level area, I noticed that the atmosphere felt quite different. The rooms were vacant, and I couldn’t tell what they were used for. So few students were in the hallways that it appeared deserted.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eJust then, my cell phone vibrated in my pocket. Pulling it out, I saw that I’d received an email. A certain girl was calling me. It was convenient, since I’d planned on killing time anyway. With no reason to reject her, I took the call with pleasure.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.2\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003e“A\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ehh. Ahhh… Ahhh…”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSakura, who’d sent me the email, was making several anxious, pained sighs.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What’s the matter?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Wah! A-Ayanokouji-kun?!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI didn’t think I’d spoken in an especially harsh or shocking way, but Sakura was so surprised that she looked like she’d been jolted with electricity. Her normally hunched posture straightened at once.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sorry for scaring you.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“N-no, no. I’m just kind of strangely nervous is all.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIf she was \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ethat\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e nervous about meeting a friend, her daily life must be a drag.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun, you’re roommates with Hirata-kun, Kouenji-kun, and Yukimura-kun. Right?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“My roommates? Yeah, you’re right. What about them?” I wasn’t expecting her to ask that.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh. Well, to tell you the truth, I…I’m a little worried about the people I’m sharing a room with.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt sounded like she didn’t really have a good relationship with her roommates. Sakura wasn’t good at socializing, anyway. One look at her deeply troubled expression, and I understood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“You’re worried because even though you want to get along with them, you don’t think you can?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m not sure. I have mixed feelings. I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edo \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003ewant to get along with them, but I also want to be alone, too. I’m just hopeless, aren’t I?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eHer voice trailed off and she shied away. Looking into her shimmering eyes, I understood. I didn’t know who else was sharing Sakura’s room, so I couldn’t really offer any advice. “By the way, who’re you rooming with?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh. Didn’t I tell you? Shinohara-san, Ichihashi-san, and Maezono-san.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe looked incredibly depressed while giving me the names. Those were all girls with strong personalities. Shinohara had a close relationship with Karuizawa; Karuizawa was like her boss, really. She was a reliable, trustworthy girl who didn’t run away from a challenge, even quarreling with the boys. But she could be rather relentless against people she didn’t like. I couldn’t imagine she thought much of Sakura, so she probably wouldn’t go out of her way to befriend her.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIchihashi was usually rather mature, but also headstrong. I didn’t really know much about Maezono, but I had a bad impression of her. She had a bad attitude and seemed quick to pick a fight. She was probably the hardest type of person for Sakura to deal with. Even if Sakura tried her hardest to bridge the gap between them, if Maezono didn’t like Sakura’s attitude, she’d probably hate her. I wanted to pat Sakura on the head and tell her how great she was. I mean, she hadn’t cried until now. She was doing great.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“But why come to me?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I…just thought any advice from you, Ayanokouji-kun, would be good?” Sakura muttered quietly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eApparently she’d come to unexpectedly rely on me. She murmured some words of apology.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I-I’m sorry to just come to you for help like this out of the blue. You’re so busy, Ayanokouji-kun.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“It’s no big deal. I don’t mind it when you come to me for advice. Whether I’ll be of much help is another story.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eSince I wasn’t really friends with any of Sakura’s roommates, I couldn’t guarantee I’d be able to help. While I was thinking of something I could do, a door opened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? Ayanokouji-kun and Sakura-san? What are you doing here?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida Kikyou from Class D exited the room. Sakura’s bright expression immediately disappeared, like the sun hiding behind the clouds. The atmosphere around us became uncomfortable. Perhaps Sakura wasn’t good at controlling her emotions, either. Sakura’s response to Kushida’s bright and cheery appearance was one of rejection, but Kushida continued talking without showing any signs that she noticed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ah, did I interrupt? I didn’t mean to. I was supposed to meet up with some friends.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m going back to my room.” Sakura retreated as fast as her legs would carry her, as if trying to withdraw from Kushida in a panic. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh. I’m sorry. I guess that was bad timing. I probably shouldn’t have said anything.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida clasped her hands together in apology. There wasn’t really any reason for her to apologize, though. Sakura was just bad at dealing with people.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh, that reminds me, I feel like this is the first time we’ve talked since getting back to the ship. I \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e see you hanging out with a bunch of girls earlier, from a distance.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida was the most popular person in Class D—no, probably in the whole school. On the day of the school entrance ceremony, she’d declared that she would make friends with everyone, and had almost accomplished that goal now. She was only missing a select few, like Sakura-san.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve made plans to go see some girls from Class C today. Do you want to come, Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Eh. Is it okay for me to join?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? You’ll come?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis was shaping up to be a bad day. Kushida’s mask had slipped a little, and her true self seemed puzzled by my response. Well, there was always the diplomatic, socially acceptable way of putting things. In other words, I had to find a polite, diplomatic way to refuse.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’m joking. Don’t you know by now that I’m not the sort of person who joins in on stuff?” \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Oh jeez, come on. You surprised me a little. Ayanokouji-kun, you’re funny.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“R-really?” Deep down, I doubted she truly found me funny, but I was scared to hear Kushida’s real thoughts.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Well, I’ll be going.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAs she bid me goodbye, both our cell phones started ringing at the same time. There was a loud, dinging sound that meant we’d received a message from the school. Usually it was a message with new instructions to follow, or some kind of modification to an event. Your phone would make a sound even if you had it on silent. Clearly, it was a message of high importance. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What is it?” Kushida asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eShe stopped in her tracks and looked puzzled, which was understandable. Even though they’d explained this system to us after school started, we hadn’t received any important messages during our summer vacation until now. Simultaneously, an announcement could be heard throughout the ship.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Attention. This is an announcement to all students. All students should have received a message from the school, as indicated in the contact line. Please check your individual mobile devices and follow the instructions accordingly. In the event that you did not receive a message, we apologize for the inconvenience. Please go to the nearest faculty member for assistance. Because the contents of the message are extremely important, please do not miss it. We repeat—”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“That was about the message we just got, right?” Kushida asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Probably.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI pulled out my phone and saw the following message:\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eA special test will begin soon. Place gather in the designated room at the designated time. Anyone who arrives later than ten minutes after start time may be penalized. Please gather in Room 204 on the second deck by 18:00 today. Because it takes about twenty minutes to reach the area, we ask that you please use the restrooms now if necessary. Either silence your phone or turn it off, and make your way over.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“A special test?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThis probably wasn’t going to be a paper test or physical fitness examination, or something you’d see at a regular school—much like the survival test on the island. However, nothing in the message implied what awaited us. Were we supposed to be able to read into something, or should we just be prepared for anything? I didn’t know.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMore than anything else, certain points in the message weighed on me. They wanted us to gather in the room at 18:00, but we only had about twenty minutes to get ready and head over, which was an extremely short amount of time. Plus, it seemed like it had been decided rather quickly. Also, why was the designated meeting spot one of the ship’s private rooms? That couldn’t make a good exam room by any standard.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Can you show me your phone for a second?” I asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida, without hesitation, showed me that she’d received the same message. The only difference was the designated time and place. In her message, the designated time was set at 20:40, but she was also told that it took about twenty minutes to reach the area. I also noticed that her designated room was just two rooms down from mine.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I wonder why they called us in such a strange way?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I have no idea.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI only knew that I had a bad feeling about this. I hadn’t thought that our cruise would end like this. A place where all the first-year students would gather inside the ship… I’d already visited places like movie theaters, party venues, and buffets. I thought I could speculate about the contents of the test based on any suspicious activity I saw, but I’d seen no indication of anything of the sort. Why would they isolate students, limit us, and then tell us to start…whatever this test was?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI quickly messaged Horikita via chat on my phone. I saw that she had read the message immediately after I sent it, which was unusual. She’d often wait about half a day before reading and replying; several days in some cases. Was it because we’d received a message from the school around the same time? I tried asking her questions.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eDid you get a message from the school just now?\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e I typed.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eYeah. I did.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eMy designated meeting time is 18:00. What about yours?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eMine says 20:40. That seems like a pretty big difference.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003e20:40, huh?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eThe same time as Kushida. So were they going to separate the guys and girls? That was all I could guess at present. They \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003edid\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e tell me that the start time for the test was at 18:00, after all.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eI’m curious about the difference in start times. That might be unfair—some people will get more time to prepare than others.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eWe can’t know anything for sure at this point.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWe chatted more about the school’s message. Horikita’s replies were instant.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eThere are several things that I’m still curious about, but we don’t really have the time. We’ll just have to show up to the meeting spot. Because your time is earlier, I look forward to hearing your report.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eUnderstood.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter I sent that short reply, she stopped responding. She had apparently shut her phone off already.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Ayanokouji-kun?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKushida, as if interested in my chat with Horikita, drew nearer to me. I considered talking to Kushida about my conversation with Horikita, but didn’t want to be a bother to her. I decided to wait and see how things progressed. It shouldn’t be long, anyway.\u003c/span\u003e\u003c/p\u003e\r\n\u003cdiv style=\"page-break-before: always;\"\u003e\u003c/div\u003e\r\n\u003cp class=\"P__STAR__STAR__STAR__page_break__And__Page_Break\"\u003e\u003cspan\u003e\u003cspan style=\" font-weight: bold; font-size: 1.17em;\"\u003e2.3\u003c/span\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u0026#160;\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-weight: bold; font-size: 3.00em;\"\u003eI\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e walked to the second deck, just as the message had instructed. I arrived at my destination about five minutes before the designated time. There were several students wandering the normally deserted level. I\u0026#160;saw some people I couldn’t identify enter a nearby room. It was more than one or two people. They came up to the designated deck and disappeared into the other rooms.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Are those students from another class?” I wondered.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAt first, I thought about waiting in front of the entrance, but things might have already gotten started inside. More than anything else, I didn’t want other students to see me, so I decided to act. A reply came immediately after I knocked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Enter.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI stepped into the room. The homeroom teacher for Class A, Mashima-sensei, wearing a well-tailored suit, sat before me in a chair. My eyes lowered to a small table on which some materials waited. Two male students sat before Mashima-sensei as well. Both were my classmates from Class D.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“So, one of the remaining two spots belongs to Ayanokouji-dono, I see! Most agreeable!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eIt was Sotomura who uttered that strange, nerdy greeting. People affectionately referred to him as “The Professor.” An overweight first-year high school student with glasses, he fit the stereotypical image of a male otaku perfectly. He was very knowledgeable about history and machinery, though much of his speech, his actual words, and his inflection all came off as unintelligible. Despite that, he was somehow able to communicate with others. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“This \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eis \u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003erather odd, isn’t it? Ayanokouji?”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eYukimura, another of my roommates on the ship, sat next to the Professor. The Professor and Yukimura. Normally, you wouldn’t find the two of them together. I wondered why they were here. What had we gotten ourselves into?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What are you doing? Hurry and take a seat.” Mashima-sensei spoke without looking at me. I silently took a seat next to Yukimura. One vacant seat beside me piqued my interest. At first glance, I guessed that we had been put into groups of one teacher and four students, but…why such small groups? Maybe the as-of-yet-unseen fourth student would shed light on the situation.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“We are still waiting on one more. Please sit quietly.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eI got the feeling that this definitely wasn’t a trivial matter. There was a storm coming, the curtain rising on a new test. A powerful omen. No matter what we might have expected, it was obvious that this test would be something entirely different. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eOrdinarily, it would be normal for everyone to receive the test’s rules at the same time to ensure fairness. Whether it was a written exam at our desks or survival on an uninhabited island, that was the norm. But here we were, in a private, enclosed space. Why did they want us in small groups? Was I was worrying too much and too early?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eNo matter how much I agonized over it, I probably wouldn’t find any answers by myself. I sat down in the chair. None of us spoke. Although we hadn’t yet passed the appointed time, I really wanted the mystery person to hurry up and get here. There was a clock in the shape of a music box, a common feature in every room on this ship. Silence hung heavy all around us. Before long, it would be 18:00. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei glanced at the clock only once, calm as you like. Simultaneously, someone knocked at the door. Mashima-sensei told that person to enter, and the door slowly opened.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Pardon the intrusion!”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eWith that, Karuizawa entered the room. I’d expected our fourth person would be from Class D, but I hadn’t expected Karuizawa. I’d thought another guy would be joining us. This was completely unexpected. \u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Huh? What’s going on? Why are Yukimura-kun and these other guys here?” she asked.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMy thoughts exactly. I couldn’t hide my bewilderment over being included in this bizarre gathering. The Professor didn’t seem to worry, but Yukimura looked puzzled.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I believe you were told punctuality was key, and yet you’re late. Hurry and take your seat,” Mashima-sensei said.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“O\u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003ekay\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa’s response indicated that she wasn’t thrilled to be here and didn’t much care what the teacher thought. She sat down and, after studying the three of us, lifted the chair and moved it a little further away from me. I felt somewhat depressed that she wanted to get away from me.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Sotomura, Yukimura, Ayanokouji, and Karuizawa, from Class D. Without further ado, I will now explain the special test.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eGood; at least we were getting an explanation after all. However, the reasoning behind selecting this group of four was still a mystery. We were in a private room, too. I\u0026#160;had a bad feeling about this.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“W-wait a minute. I don’t understand. What do you mean, \u003c/span\u003e\u003cspan style=\" font-style: italic; font-size: 1.00em;\"\u003eexplain\u003c/span\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e a test? The test was already over, right? Also, what’s the deal with these guys? This is really weird.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eKaruizawa, unable to listen to anyone else talk, immediately barraged Mashima-sensei with questions. I wondered if she’d even read the message properly.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I will not answer any questions at this time. Be quiet and listen.” Sure enough, Mashima-sensei looked coldly at Karuizawa.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Jeez, all right. Fine, I’ll shut up.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eMashima-sensei had a reputation of being rather cold to his students. Even now, he seemed aloof during a simple explanation. My own homeroom teacher, Chabashira-sensei, was also indifferent, cold, and didn’t provide any support to her students. Like her, Mashima-sensei didn’t seem like the kind of teacher who would provide a shoulder for Class A students to cry on. The only definite difference between the teachers was that in comparison to Chabashira-sensei, who seemed unmotivated and unnaturally uncooperative, Mashima-sensei was impossible to read. I wondered if he kept everyone at a certain fixed distance, no matter who they were.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“In this special test, all the first-year students will be divided into twelve groups based on the signs of the Zodiac. Everyone will participate within their respective group. The purpose of this examination is to test your thinking.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eTwelve groups based on the signs of the Zodiac? That meant Class D was divided into three groups, and those three groups would represent three of the twelve signs. Apparently this would test our “thinking.” They wanted to test our ability to think, and to process information thoroughly. Was that it?\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“What do you mean by ‘test our thinking’?” Karuizawa, unable to stay silent, reflexively spoke up with another question.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“I’ve already told you. I will not be answering any questions.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAfter Mashima-sensei’s second warning, Karuizawa seemed to feel the gravity of our situation. Although she looked blatantly unhappy, she shut her mouth and listened. I didn’t know how seriously Yukimura and the Professor took all this, but they remained silent.\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003e“Society needs three fundamental qualities in order to progress: action, thinking, and teamwork. Those with the necessary qualities will become wonderful adults. The\u0026#160;previous exam on the uninhabited island focused heavily on testing your teamwork. However, we shall now test your thinking in four ways: your ability to thoroughly process information, which is an essential component of this test. Your ability to analyze your current situation and clarify the task at hand. The ability to solve the problem after you’ve clarified the process and identified the task. The ability to utilize your imagination, and the ability to create new values. Those are the qualities you’ll need.”\u003c/span\u003e\u003c/p\u003e\r\n\u003cp class=\"P_Prose_Formatting\"\u003e\u003cspan style=\" font-size: 1.00em;\"\u003eAlthough his explanation was rather concise, several question marks were still hanging over everyone’s
